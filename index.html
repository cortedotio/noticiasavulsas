<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Avulsas</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #f1f2f5; 
        }
        
        /* TRUQUE PARA ESCONDER A BARRA DO GOOGLE SCRIPT */
        .app-container {
            width: 100%;
            height: calc(100% + 30px); 
            margin-top: -30px; 
            position: relative;
        }
        
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div class="app-container">
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        // ⚠️ SUBSTITUA O TEXTO ABAIXO PELO SEU NOVO LINK DO GOOGLE APPS SCRIPT (Tem de terminar em /exec)
        const gasScriptUrl = "https://script.google.com/macros/s/AKfycbxXsMaSfzgcbIETnmLnkF_j6SpqRzjsXm4wt7dLDlCS_Ax8vvj_M3denwt5rk-2rWVb/exec";

        // Captura a URL atual (ex: /esportes/titulo/12345)
        const currentPath = window.location.pathname + window.location.search;

        // Injeta a rota no iframe para o Google Script saber o que carregar
        const iframe = document.getElementById('app-frame');
        iframe.src = gasScriptUrl + "?route=" + encodeURIComponent(currentPath);

        // Escuta mensagens vindas DENTRO do Google Script para mudar a URL do navegador
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                window.history.pushState(null, '', event.data.path);
            }
        });

        // Quando o utilizador clica em "Voltar" no navegador
        window.addEventListener('popstate', function() {
            const newPath = window.location.pathname + window.location.search;
            iframe.src = gasScriptUrl + "?route=" + encodeURIComponent(newPath);
        });
    </script>
</body>
</html></body>
</html>
