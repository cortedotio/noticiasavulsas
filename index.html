<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Redação - Notícias Avulsas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Merriweather', 'serif'] },
                    colors: { jornal: { blue: '#0F172A', red: '#E11D48', gray: '#F8FAFC', dark: '#020617' } }
                }
            }
        };
    </script>
    <style>
        body { background-color: #f1f2f5; color: #111111; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .rich-editor img { max-width: 100%; height: auto; border-radius: 8px; margin: 16px auto; border: 1px solid #e2e8f0; display: block; }
        .rich-editor iframe, .rich-editor video { max-width: 100%; border-radius: 8px; margin: 8px 0; background: #000; }
        .rich-editor a { color: #2563eb; text-decoration: underline; font-weight: 500; }
        .rich-editor h1 { font-size: 1.5em; font-weight: 900; margin: 16px 0 8px 0; font-family: 'Inter', sans-serif; }
        .rich-editor h2 { font-size: 1.25em; font-weight: 800; margin: 12px 0 8px 0; font-family: 'Inter', sans-serif; }
        .rich-editor blockquote { border-left: 4px solid #E11D48; background: #f8fafc; padding: 12px 16px; color: #475569; font-style: italic; margin: 16px 0; border-radius: 0 8px 8px 0; }
        .rich-editor ul { list-style-type: disc; padding-left: 24px; margin-bottom: 12px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative selection:bg-jornal-red selection:text-white">

    <div id="toast" class="hidden fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border rounded-sm">
        <span id="toast-icon" class="text-xl"></span>
        <span id="toast-msg" class="text-sm"></span>
    </div>

    <div id="loading-global" class="fixed inset-0 z-[99998] bg-jornal-dark flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-gray-700 border-t-jornal-red rounded-full animate-spin mb-4"></div>
        <p class="text-xs font-black uppercase tracking-widest text-gray-300 animate-pulse">Acessar Redação...</p>
    </div>

    <div id="modalLogin" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-jornal-dark/95 backdrop-blur-md"></div>
        <div class="bg-white w-full max-w-sm p-8 rounded-sm shadow-2xl relative z-10 border-t-4 border-jornal-red">
            <div class="mb-6 text-center">
                <h2 class="font-sans text-xl font-black uppercase text-jornal-dark tracking-tighter">Acesso à Redação</h2>
            </div>
            <form onsubmit="fazerLogin(event)" class="space-y-4">
                <input type="text" id="login-user" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 focus:outline-none focus:border-jornal-blue text-sm font-bold rounded-sm" required placeholder="Usuário" />
                <input type="password" id="login-pass" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 focus:outline-none focus:border-jornal-blue text-sm font-bold rounded-sm" required placeholder="Senha" />
                <button type="submit" id="btn-fazer-login" class="w-full bg-jornal-blue text-white font-black py-3 hover:opacity-90 transition-colors text-xs uppercase tracking-widest rounded-sm mt-4">Entrar no Painel</button>
            </form>
        </div>
    </div>

    <div id="view-admin" class="hidden min-h-screen flex flex-col bg-gray-100 text-slate-800">
        <header class="bg-jornal-dark text-white border-b border-gray-800 sticky top-0 z-40 shadow-sm">
            <div class="max-w-[1400px] mx-auto flex justify-between items-center px-4 py-3">
                <div class="flex items-center gap-3">
                    <span class="font-sans font-black tracking-tighter text-lg uppercase text-slate-100 flex items-center gap-2">Painel<span class="text-rose-600">Redação</span></span>
                    <span id="label-usuario-logado" class="hidden md:inline-block ml-4 text-[9px] bg-gray-800 px-2 py-1 rounded text-gray-300 font-bold uppercase tracking-widest border border-gray-700"></span>
                </div>
                <div class="flex items-center gap-2 md:gap-4">
                    <a href="index.html" class="text-gray-400 hover:text-white text-[10px] font-bold uppercase tracking-wider hidden md:flex items-center gap-1 transition-colors">Portal</a>
                    <a href="config.html" class="text-gray-400 hover:text-emerald-400 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 transition-colors border-l border-gray-700 pl-4">⚙️ Máquinas</a>
                    <a href="instagram.html" class="text-gray-400 hover:text-pink-400 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 transition-colors border-l border-gray-700 pl-4">📸 Estúdio IG</a>
                    <button type="button" onclick="encerrarSessao()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-sm text-[10px] font-black uppercase tracking-widest transition-colors ml-2">Sair</button>
                </div>
            </div>
        </header>

        <main class="max-w-[1400px] mx-auto py-6 md:py-8 px-4 w-full flex-grow">
            <div id="barra-de-abas" class="flex gap-1 mb-6 border-b-2 border-gray-300 overflow-x-auto custom-scrollbar"></div>

            <!-- ABA 1: PUBLICAR -->
            <div id="form-noticia-container" class="bg-white p-6 md:p-8 shadow-sm border border-gray-200 rounded-sm hidden">
                <div class="border-l-4 border-jornal-red pl-3 mb-8">
                    <h2 class="font-sans text-xl font-black text-jornal-dark uppercase tracking-tighter">Redigir Matéria</h2>
                </div>
                <form id="form-admin" onsubmit="salvarNoticia(event)" class="space-y-6">
                    <input type="hidden" id="admin-id-noticia" value="" />
                    <div class="flex flex-col lg:flex-row gap-6">
                        <div class="lg:w-2/3 flex flex-col gap-6">
                            <div>
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-2 block">Manchete</label>
                                <input type="text" id="admin-titulo" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 focus:outline-none focus:border-jornal-blue font-serif font-bold text-lg text-jornal-dark rounded-sm" required />
                            </div>
                            <div>
                                <div class="flex justify-between items-end mb-2">
                                    <label class="text-[10px] font-black uppercase tracking-widest text-gray-500">Linha Fina</label>
                                    <button type="button" id="btn-ia-linhafina" onclick="gerarLinhaFinaIA()" class="text-[10px] font-bold text-purple-600 hover:text-purple-800 flex items-center gap-1 transition-colors">✨ Gerar com IA</button>
                                </div>
                                <input type="text" id="admin-linha-fina" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 focus:outline-none focus:border-jornal-blue text-sm rounded-sm" />
                            </div>
                        </div>
                        <div class="lg:w-1/3">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-2 block">Editorias</label>
                            <div class="p-4 bg-gray-50 border border-gray-300 rounded-sm">
                                <div id="admin-categoria-checklist" class="max-h-[120px] overflow-y-auto custom-scrollbar flex flex-col gap-2"></div>
                            </div>
                            <button type="button" onclick="novaCategoria()" class="text-[10px] font-black text-jornal-red hover:opacity-80 mt-2 block">+ Nova Editoria</button>
                        </div>
                    </div>

                    <div id="admin-cidade-container" class="hidden p-5 bg-blue-50 border border-blue-200 rounded-sm">
                        <label for="admin-cidade" class="text-[11px] font-black uppercase tracking-widest text-jornal-blue mb-2 block">Cidade *</label>
                        <input type="text" id="admin-cidade" class="w-full px-4 py-3 bg-white border border-blue-300 text-sm rounded-sm" />
                    </div>

                    <div>
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-2 block">Autor</label>
                        <input type="text" id="admin-autor" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 text-sm rounded-sm" />
                    </div>

                    <div>
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-2 block">Conteúdo</label>
                        <input type="file" id="upload-imagem-conteudo" accept="image/*" class="hidden" onchange="processarUploadImagemConteudo(this)" />
                        
                        <div class="flex flex-wrap gap-1 p-2 bg-gray-100 border border-gray-300 border-b-0 rounded-t-sm items-center">
                            <button type="button" onclick="execCmd('bold')" class="px-2.5 py-1.5 bg-white border border-gray-300 text-xs font-bold rounded shadow-sm">B</button>
                            <button type="button" onclick="execCmd('italic')" class="px-2.5 py-1.5 bg-white border border-gray-300 text-xs italic rounded shadow-sm">I</button>
                            <button type="button" onclick="execCmd('underline')" class="px-2.5 py-1.5 bg-white border border-gray-300 text-xs underline rounded shadow-sm">U</button>
                            <span class="w-[1px] h-5 bg-gray-300 mx-1"></span>
                            <select onchange="execCmd('fontSize', this.value); this.selectedIndex=1;" class="px-2 py-1.5 bg-white border border-gray-300 text-xs rounded shadow-sm"><option value="1">Pequeno</option><option value="3" selected>Normal</option><option value="5">Grande</option></select>
                            <span class="w-[1px] h-5 bg-gray-300 mx-1"></span>
                            <button type="button" onclick="execCmd('justifyLeft')" class="px-2 py-1.5 bg-white border border-gray-300 text-xs rounded shadow-sm">Esq</button>
                            <button type="button" onclick="execCmd('justifyCenter')" class="px-2 py-1.5 bg-white border border-gray-300 text-xs rounded shadow-sm">Cen</button>
                            <span class="w-[1px] h-5 bg-gray-300 mx-1"></span>
                            <button type="button" onclick="inserirLinkRichEditor()" class="px-2 py-1.5 bg-white text-blue-600 border border-gray-300 text-xs rounded shadow-sm">🔗</button>
                            <button type="button" onclick="inserirImagemRichEditor()" class="px-2 py-1.5 bg-white text-emerald-600 border border-gray-300 text-xs rounded shadow-sm">🖼️</button>
                            <button type="button" onclick="inserirVideoRichEditor()" class="px-2 py-1.5 bg-white text-purple-600 border border-gray-300 text-xs rounded shadow-sm">📹</button>
                            <span class="w-[1px] h-5 bg-gray-300 mx-1"></span>
                            <button type="button" onclick="execCmd('formatBlock', 'H2')" class="px-2 py-1.5 bg-white border border-gray-300 text-xs font-bold rounded shadow-sm">H2</button>
                            <button type="button" id="btn-ia-conteudo" onclick="gerarConteudoIA()" class="ml-auto px-4 py-1.5 bg-purple-100 border border-purple-300 text-xs text-purple-800 font-bold rounded shadow-sm">✨ Escrever com IA</button>
                        </div>
                        <div id="admin-editor-rich" contenteditable="true" class="w-full px-6 py-6 bg-white border border-gray-300 rounded-b-sm min-h-[350px] max-h-[600px] overflow-y-auto focus:outline-none text-base font-serif rich-editor"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 bg-gray-50 border border-gray-200 rounded-sm">
                        <div>
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-3 block">Foto de Capa</label>
                            <input type="file" id="admin-arquivo-imagem" accept="image/*" class="w-full text-sm bg-white border border-gray-300 rounded-sm" onchange="verificarUploadMedia(this)" />
                            <img id="preview-imagem" class="mt-4 w-full h-40 object-contain bg-gray-900 rounded-sm hidden" />
                        </div>
                        <div class="flex flex-col gap-6">
                            <div>
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 block mb-2">Data e Hora (Agendamento)</label>
                                <input type="datetime-local" id="admin-agendamento" class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-sm" />
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase tracking-widest text-rose-600 block mb-2">Fim do Evento</label>
                                <input type="datetime-local" id="admin-data-fim-evento" class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-sm" />
                            </div>
                        </div>
                    </div>

                    <div id="admin-imagem-metadados" class="hidden p-6 bg-amber-50 border border-amber-200 rounded-sm">
                        <h4 class="text-[11px] font-black text-amber-800 uppercase tracking-widest mb-4">Créditos de Imagem</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="text" id="admin-legenda-imagem" placeholder="Legenda (Opcional)" class="w-full px-4 py-2 bg-white border border-gray-300 text-sm rounded-sm" />
                            <input type="text" id="admin-creditos-imagem" placeholder="Créditos da Imagem *" class="w-full px-4 py-2 bg-white border border-red-300 text-sm rounded-sm" />
                        </div>
                    </div>

                    <div class="p-6 bg-indigo-50 border border-indigo-100 rounded-sm">
                        <label class="text-[11px] font-black uppercase tracking-widest text-indigo-800 mb-3 block">Notícias Relacionadas</label>
                        <div class="flex gap-2">
                            <input type="text" id="admin-busca-relacionada" placeholder="Pesquisar..." class="flex-grow px-4 py-3 border border-indigo-200 rounded-sm text-sm">
                            <button type="button" onclick="buscarRelacionadas()" class="bg-indigo-600 text-white px-6 py-3 rounded-sm text-xs font-bold uppercase tracking-widest">Pesquisar</button>
                        </div>
                        <div id="lista-resultados-relacionadas" class="mt-4 space-y-2"></div>
                        <div id="lista-selecionadas-relacionadas" class="mt-4 space-y-2"></div>
                        <input type="hidden" id="admin-relacionadas-ids" value="">
                    </div>

                    <div class="p-5 bg-sky-50 border border-sky-100 rounded-sm">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="admin-carrossel" class="w-5 h-5 text-jornal-blue rounded" />
                            <span class="text-sm font-black text-jornal-dark uppercase tracking-widest">Adicionar ao Carrossel</span>
                        </label>
                    </div>

                    <div class="pt-6 flex justify-between items-center gap-4">
                        <button type="button" onclick="limparFormNoticia()" class="text-xs font-black text-gray-500 uppercase tracking-widest py-2">Limpar Form</button>
                        <button type="submit" id="btn-salvar-noticia" class="bg-jornal-dark text-white font-black px-12 py-4 uppercase tracking-widest text-sm rounded-sm shadow-xl">Publicar Matéria</button>
                    </div>
                </form>
            </div>

            <!-- ABA 2: LISTA -->
            <div id="lista-noticias-container" class="hidden bg-white p-6 shadow-sm border border-gray-200 rounded-sm">
                <div class="border-l-4 border-jornal-red pl-3 mb-6"><h2 class="text-xl font-black text-jornal-dark uppercase tracking-tighter">Editar Publicações</h2></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-gray-50 border border-gray-200 rounded-sm">
                    <select id="admin-filtro-editoria" onchange="carregarListaEdicao()" class="w-full px-4 py-3 bg-white border border-gray-300 text-sm font-bold rounded-sm"><option value="todas">Todas as editorias</option></select>
                    <input type="search" id="admin-pesquisa-materia" oninput="carregarListaEdicao()" placeholder="Pesquisar matéria..." class="w-full px-4 py-3 bg-white border border-gray-300 text-sm rounded-sm" />
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-100 border-b border-gray-300 text-[10px] uppercase tracking-widest text-gray-500">
                            <tr><th class="p-4">Data</th><th class="p-4">Editorias</th><th class="p-4">Manchete</th><th class="p-4 text-center">Visões</th><th class="p-4 text-center">Status</th><th class="p-4 text-center">Ações</th></tr>
                        </thead>
                        <tbody id="admin-tabela-noticias" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

            <!-- ABA 3: CAPA -->
            <div id="form-capa-container" class="hidden bg-white p-6 md:p-8 shadow-sm border border-gray-200 rounded-sm">
                <div class="border-l-4 border-emerald-600 pl-3 mb-6"><h2 class="text-xl font-black text-jornal-dark uppercase tracking-tighter">Organizar Capa</h2></div>
                <form onsubmit="salvarOrdemCapa(event)">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8" id="selects-capa-container"></div>
                    <div class="pt-6 border-t border-gray-200 flex justify-end"><button type="submit" id="btn-salvar-capa" class="bg-emerald-600 text-white font-black px-10 py-3.5 uppercase text-sm rounded-sm">Salvar Ordem</button></div>
                </form>
            </div>

            <!-- ABA 4: PLACAR -->
            <div id="form-placar-container" class="hidden bg-white p-6 md:p-8 shadow-sm border border-gray-200 rounded-sm">
                <div class="border-l-4 border-green-600 pl-3 mb-6"><h2 class="text-xl font-black text-jornal-dark uppercase tracking-tighter">Desporto ao Vivo</h2></div>
                <form id="form-placar" onsubmit="salvarPlacarAoVivo(event)">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="p-5 bg-gray-50 border border-gray-200 rounded-sm">
                            <h3 class="text-[11px] font-black uppercase text-jornal-blue mb-4">Futebol: Brasil</h3>
                            <label class="flex items-center gap-3 mb-3 cursor-pointer"><input type="checkbox" name="liga-placar" value="soccer/bra.1" class="w-4 h-4 rounded" /> <span class="text-sm font-bold">Brasileirão Série A</span></label>
                            <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" name="liga-placar" value="soccer/bra.copa_do_brasil" class="w-4 h-4 rounded" /> <span class="text-sm font-bold">Copa do Brasil</span></label>
                        </div>
                        <div class="p-5 bg-gray-50 border border-gray-200 rounded-sm">
                            <h3 class="text-[11px] font-black uppercase text-green-700 mb-4">Futebol: Internacional</h3>
                            <label class="flex items-center gap-3 mb-3 cursor-pointer"><input type="checkbox" name="liga-placar" value="soccer/conmebol.libertadores" class="w-4 h-4 rounded" /> <span class="text-sm font-bold">Libertadores</span></label>
                            <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" name="liga-placar" value="soccer/uefa.champions" class="w-4 h-4 rounded" /> <span class="text-sm font-bold">Champions League</span></label>
                        </div>
                    </div>
                    <div class="pt-6 border-t border-gray-200 flex justify-end"><button type="submit" id="btn-salvar-placar" class="bg-green-600 text-white font-black px-12 py-3.5 uppercase text-sm rounded-sm">Salvar Ligas</button></div>
                </form>
            </div>
        </main>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzZ3tg6RONdf9KODrdz25LYGjEGF6m1DTdM9_NUBnVrm6WGGp6k8rapdg-wDu049Tee/exec";
        let noticiasGlobais = [];
        let configuracoesGlobais = {};
        let listaCategoriasLocais = [];
        let usuarioLogado = "";
        let permissoesAtuais = [];
        let isMasterAdmin = false;
        let base64StringNoticia = ""; 
        let mimeStringNoticia = ""; 
        let nameStringNoticia = "";
        window.relacionadasSelecionadas = [];

        const ABAS_SISTEMA = [
            { id: 'Publicar', tabId: 'aba-noticia', containerId: 'form-noticia-container', nome: 'Publicar', cor: 'bg-jornal-blue' },
            { id: 'Gerir', tabId: 'aba-lista', containerId: 'lista-noticias-container', nome: 'Gerir Matérias', cor: 'bg-jornal-dark' },
            { id: 'Layout', tabId: 'aba-capa', containerId: 'form-capa-container', nome: 'Layout Capa', cor: 'bg-emerald-600' },
            { id: 'Placar', tabId: 'aba-placar', containerId: 'form-placar-container', nome: 'Placar', cor: 'bg-green-700' }
        ];

        window.google = { script: { run: { withSuccessHandler: function(cb) { this._onSuccess = cb; return this; }, withFailureHandler: function(cb) { this._onFailure = cb; return this; } } } };
        const apiFunctions = ['getHomeData', 'verificarLogin', 'salvarNoticiaNoSheets', 'alternarStatusNoticia', 'excluirNoticia', 'salvarConfiguracaoHTMLCustom', 'chamarGeminiBackend', 'adicionarCategoriaNoSheets'];
        
        apiFunctions.forEach(function(funcName) {
            window.google.script.run[funcName] = function() {
                var args = Array.prototype.slice.call(arguments);
                var suc = this._onSuccess; var fail = this._onFailure;
                this._onSuccess = null; this._onFailure = null;
                fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: funcName, args: args }) })
                .then(res => res.json()).then(res => { if(suc) { let p = res; if(res && res.result) p = typeof res.result === 'string' ? JSON.parse(res.result) : res.result; suc(p); } })
                .catch(err => { if(fail) fail(err); else mostrarMensagem("Erro na API", 'erro'); });
            };
        });

        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem('admin_logado') === 'true') {
                usuarioLogado = localStorage.getItem('admin_usuario');
                document.getElementById('label-usuario-logado').innerText = "Logado como: " + usuarioLogado;
                document.getElementById('label-usuario-logado').classList.remove('hidden');
                
                var uPerms = localStorage.getItem('admin_permissoes');
                if(uPerms === 'master') { isMasterAdmin = true; permissoesAtuais = ABAS_SISTEMA.map(a => a.id); } 
                else { permissoesAtuais = (uPerms || '').split(','); }
                
                document.getElementById('modalLogin').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                construirMenuAbas();
                carregarDadosAdmin();
            } else {
                document.getElementById('loading-global').classList.add('hidden');
                document.getElementById('modalLogin').classList.remove('hidden');
                document.getElementById('modalLogin').classList.add('flex');
            }
        });

        function mostrarMensagem(mensagem, tipo) {
            var toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = mensagem;
            toast.className = tipo === 'erro' ? 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-white border-red-600 text-red-600 rounded-sm' : 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-jornal-dark text-white rounded-sm';
            document.getElementById('toast-icon').innerHTML = tipo === 'erro' ? '⚠️' : '✓';
            toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 4500);
        }

        function fazerLogin(e) {
            e.preventDefault();
            var u = document.getElementById('login-user').value;

        function execCmd(command, arg) { if(arg === undefined) arg = null; document.execCommand(command, false, arg); document.getElementById('admin-editor-rich').focus(); }

        function processarUploadImagemConteudo(input) {
            if (!input.files || !input.files[0]) return;
            var file = input.files[0];
            var legenda = prompt("Legenda para a imagem (opcional):") || "";
            var creditos = prompt("Créditos da foto (obrigatório se houver direitos):") || "";
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas'); var ctx = canvas.getContext('2d');
                    var scale = img.width > 800 ? 800 / img.width : 1;
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    var base64Resized = canvas.toDataURL('image/jpeg', 0.8);
                    var htmlImg = `<br><figure style="margin: 16px auto; text-align: center; max-width: 100%; display: block;"><img src="${base64Resized}" style="max-width: 100%; height: auto; border-radius: 8px; display: inline-block; margin: 0 auto; border: 1px solid #e2e8f0;" />`;
                    if (legenda || creditos) {
                        var credTexto = creditos ? 'Foto: ' + creditos : ''; var sep = (legenda && creditos) ? ' - ' : '';
                        htmlImg += `<figcaption style="font-size: 12px; color: #64748b; margin-top: 8px; font-style: italic; text-align: center;">${legenda}${sep}${credTexto}</figcaption>`;
                    }
                    htmlImg += `</figure><br><p>&#8203;</p>`;
                    execCmd('insertHTML', htmlImg); input.value = '';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                if (!prevSrc || prevSrc === "" || prevSrc.includes('placehold')) {

                }
            }
        }

                id: editandoID, titulo: document.getElementById('admin-titulo').value,

            else { payload.isUpload = false; }
            
            window.google.script.run.withSuccessHandler(function(res) {

        function atualizarFiltroEditoriasAdmin() {
            var select = document.getElementById('admin-filtro-editoria');
            if (!select) return;
            var valorAtual = select.value || 'todas';
            var categorias = [];
            noticiasGlobais.forEach(n => {
                String(n.categoria || '').split(',').forEach(categoria => {
                    var nome = categoria.trim();
                    if (nome && !categorias.map(normalizarTexto).includes(normalizarTexto(nome))) categorias.push(nome);
                });
            });
            categorias.sort();
            select.innerHTML = '<option value="todas">Todas as editorias</option>' + categorias.map(c => `<option value="${c.replace(/"/g, '&quot;')}">${c}</option>`).join('');
            select.value = Array.from(select.options).some(o => o.value === valorAtual) ? valorAtual : 'todas';
        }

        function carregarListaEdicao() {
            var tbody = document.getElementById('admin-tabela-noticias');

            atualizarFiltroEditoriasAdmin();
            tbody.innerHTML = '';
            
            var sel = document.getElementById('admin-filtro-editoria'); var inp = document.getElementById('admin-pesquisa-materia');
            var catSel = normalizarTexto(sel ? sel.value : 'todas'); var term = normalizarTexto(inp ? inp.value : '');
            
            var filtradas = noticiasGlobais.filter(n => {
                var cats = String(n.categoria || '').split(',').map(normalizarTexto);
                var matchCat = catSel === 'todas' || cats.includes(catSel);
                var text = normalizarTexto([n.titulo, n.linhaFina, n.cidade].join(' '));
                return matchCat && (!term || text.includes(term));
            });
            
            if (filtradas.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-xs text-gray-500 font-bold">Nenhuma matéria encontrada.</td></tr>'; return; }
            
            filtradas.forEach(n => {
                var isAtivo = String(n.status).toLowerCase() === 'ativa';
                var isAgendada = String(n.status).toLowerCase() === 'agendada';
                var txtStat = isAtivo ? 'ATIVO' : (isAgendada ? 'AGENDADO' : 'INATIVO');

                        <td class="p-4 font-bold text-sm text-jornal-dark truncate max-w-[250px]">${n.titulo || ''}<span class="block mt-1 text-[8px] text-purple-600">Por: ${n.usuarioPublicador || 'Desconhecido'}</span></td>

                                <div class="w-10 h-5 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-emerald-500"></div>

                        </td>

            });

        function editarNoticia(id) {
            var noticia = noticiasGlobais.find(n => String(n.id) === String(id)); 
            if(!noticia) return;
            limparFormNoticia();
            
            document.getElementById('admin-id-noticia').value = noticia.id;
            document.getElementById('admin-titulo').value = noticia.titulo || '';
            document.getElementById('admin-linha-fina').value = noticia.linhaFina || "";
            document.getElementById('admin-editor-rich').innerHTML = noticia.conteudo || '';
            document.getElementById('admin-autor').value = noticia.autor !== "da redação" ? (noticia.autor || '') : "";
            document.getElementById('admin-carrossel').checked = (String(noticia.noCarrossel) === 'true');
            
            if (noticia.dataHora) {
                var p = noticia.dataHora.split(/[\/\s:]/);
                if (p.length >= 5) document.getElementById('admin-agendamento').value = p[2]+'-'+p[1]+'-'+p[0]+'T'+p[3]+':'+p[4];
            }
            if (noticia.dataFimEvento) { try { var dtFim = new Date(noticia.dataFimEvento); if(!isNaN(dtFim.getTime())) document.getElementById('admin-data-fim-evento').value = dtFim.toISOString().slice(0,16); } catch(e){} }
            
            var cats = String(noticia.categoria).split(',').map(c => c.trim().toLowerCase());
            document.querySelectorAll('input[name="admin-categorias-checkbox"]').forEach(cb => cb.checked = cats.includes(cb.value.toLowerCase()));
            
            if(document.getElementById('admin-cidade')) document.getElementById('admin-cidade').value = noticia.cidade || '';
            atualizarCampoCidadeAdmin();
            
            document.getElementById('admin-legenda-imagem').value = noticia.legendaImagem || '';
            document.getElementById('admin-creditos-imagem').value = noticia.creditosImagem || '';

            var prevImg = document.getElementById('preview-imagem');
            if (prevImg) {
                if(noticia.urlImagem) { prevImg.src = noticia.urlImagem; prevImg.classList.remove('hidden'); document.getElementById('admin-imagem-metadados').classList.remove('hidden'); } 
                else { prevImg.classList.add('hidden'); }
            }
            
            if (noticia.relacionadas) {
                var relIds = String(noticia.relacionadas).split(',');
                window.relacionadasSelecionadas = [];
                relIds.forEach(rId => {
                    var rn = noticiasGlobais.find(x => x.id === rId.trim());
                    if(rn) window.relacionadasSelecionadas.push({id: rn.id, titulo: rn.titulo});
                });
                atualizarUIListaRelacionadas();
            }

            document.getElementById('btn-salvar-noticia').innerText = "SALVAR ALTERAÇÕES";
            alternarAbaAdmin('form-noticia-container');
        }

            if(configuracoesGlobais['CategoriasCapa']) { try { ordemAtual = JSON.parse(configuracoesGlobais['CategoriasCapa']); } catch(e){} }
            for(var i = 1; i <= 8; i++) {
                var v = ordemAtual.length >= i ? ordemAtual[i-1] : '';
                html += `<div><label class="text-[10px] font-bold uppercase text-gray-500 mb-2 block">Posição ${i}</label><select id="capa-pos-${i}" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 text-sm font-bold rounded-sm"><option value="">-- NENHUMA --</option>`;
                listaCategoriasLocais.forEach(c => { html += `<option value="${c}" ${c === v ? 'selected' : ''}>${c}</option>`; });
                html += `</select></div>`;
            }
            container.innerHTML = html;
        }

        function salvarOrdemCapa(e) {
            e.preventDefault(); var btn = document.getElementById('btn-salvar-capa'); var txt = btn.innerHTML; btn.innerHTML = "A SALVAR..."; btn.disabled = true;
            var sel = []; for(var i = 1; i <= 8; i++) { var val = document.getElementById('capa-pos-' + i).value; if(val) sel.push(val); }
            var jsonStr = JSON.stringify(sel);
            window.google.script.run.withSuccessHandler(function() { 
                mostrarMensagem("Ordem da capa atualizada!"); configuracoesGlobais['CategoriasCapa'] = jsonStr; btn.innerHTML = txt; btn.disabled = false; 
            }).salvarConfiguracaoHTMLCustom('CategoriasCapa', jsonStr);
        }

        function preencherFormPlacar() {
            var ligasAtivas = []; if (configuracoesGlobais['LigasPlacar']) { try { ligasAtivas = JSON.parse(configuracoesGlobais['LigasPlacar']); } catch(e){} }
            document.querySelectorAll('input[name="liga-placar"]').forEach(cb => cb.checked = ligasAtivas.includes(cb.value));
        }

        function salvarPlacarAoVivo(e) {
            e.preventDefault(); var btn = document.getElementById('btn-salvar-placar'); btn.innerText = "A SALVAR..."; btn.disabled = true;
            var ligas = Array.from(document.querySelectorAll('input[name="liga-placar"]:checked')).map(cb => cb.value);
            window.google.script.run.withSuccessHandler(function() { 
                mostrarMensagem("Placar atualizado!"); btn.innerText = "Salvar Ligas"; btn.disabled = false; configuracoesGlobais['LigasPlacar'] = JSON.stringify(ligas); 
            }).salvarConfiguracaoHTMLCustom("LigasPlacar", JSON.stringify(ligas));
        }

    </script>
</body>
</html>
