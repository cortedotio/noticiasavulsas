<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Avulsas</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f1f2f5; }
        
        /* Oculta a barra da Google empurrando o site suavemente para cima */
        .app-container {
            width: 100%;
            height: calc(100% + 30px);
            margin-top: -30px;
            position: relative;
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div class="app-container">
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        // O seu link de Deploy Oficial do Google Apps Script (atualizado conforme a sua imagem)
        const gasScriptUrl = "https://script.google.com/macros/s/AKfycbyYjyJhk5BEgKo4lr8wx2x7yK1mKnBRCBgjd1Ht9TH8vxXTVb2z1uSqm3zQkoFFXxI/exec";
        
        // Deteta a URL que o leitor tentou aceder e envia para o Google Script
        const currentPath = window.location.pathname + window.location.search;
        const iframe = document.getElementById('app-frame');
        iframe.src = gasScriptUrl + "?route=" + encodeURIComponent(currentPath);

        // Ouve a ordem do Google Script para mudar o link da barra de navegação no momento do clique
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                window.history.pushState(null, '', event.data.path);
            }
        });

        // Garante que o botão "Voltar" do telemóvel/PC funciona perfeitamente
        window.addEventListener('popstate', function() {
            const newPath = window.location.pathname + window.location.search;
            iframe.src = gasScriptUrl + "?route=" + encodeURIComponent(newPath);
        });
    </script>
</body>
</html>
