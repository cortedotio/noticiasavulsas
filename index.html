<!DOCTYPE html>
<html lang="pt-PT" style="margin: 0; padding: 0; height: 100%; overflow: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Avulsas - Portal</title>
    <style>
        /* Tira as margens e esconde a barra de rolagem lateral nativa, o iframe faz o scroll */
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #f1f2f5; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    
    <!-- Este Iframe carrega secretamente a sua interface do Google sem ninguém perceber -->
    <iframe id="portal-frame" allowfullscreen></iframe>
    
    <script>
        // ⚠️ IMPORTANTE: COLE AQUI O SEU LINK DE EXECUÇÃO DO GOOGLE APPS SCRIPT (URL que acaba em /exec)
        const URL_DO_SEU_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbyWV5PUlYgwsU4AqyLITbAeOw89rJDnXoGQvVVJcKsFiCJAPN_tLOoTfBA3IX2TfOMx/exec";
        
        const iframe = document.getElementById("portal-frame");
        
        // 1. Inicia o Iframe. Repassamos a URL atual do GitHub para ele saber se deve abrir uma noticia direta.
        function getIframeUrl() {
            let hash = window.location.hash.replace('#', '');
            let query = '';
            
            // Traduz a Rota Hash do GitHub para parâmetros que o Apps Script entende
            if (hash.startsWith('/noticia/')) {
                query = '?noticia=' + hash.split('/noticia/')[1];
            } else if (hash.startsWith('/categoria/')) {
                query = '?categoria=' + encodeURIComponent(hash.split('/categoria/')[1]);
            }
            
            return URL_DO_SEU_WEB_APP_GOOGLE + query;
        }

        iframe.src = getIframeUrl();

        // 2. Fica a escutar as mensagens do Google Apps Script
        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'NAVEGACAO') {
                
                let newHash = '/';
                
                if (event.data.noticiaId) {
                    newHash = '/noticia/' + event.data.noticiaId;
                } else if (event.data.categoria && event.data.categoria !== 'Todas') {
                    newHash = '/categoria/' + encodeURIComponent(event.data.categoria);
                }
                
                // O Iframe avisou que navegou. Alteramos a URL do Github (usando HASH #) sem dar refresh nem erro 404!
                if (window.location.hash !== '#' + newHash && newHash !== '/') {
                    window.history.pushState(null, '', '#' + newHash);
                } else if (newHash === '/' && window.location.hash !== '') {
                    window.history.pushState(null, '', window.location.pathname); 
                }
            }
        });

        // 3. Se o utilizador clicar na seta de "Voltar" ou "Avançar" do navegador Chrome/Safari, atualiza o Iframe MUITO MAIS RÁPIDO!
        window.addEventListener('popstate', function(event) {
            // Avisamos o Iframe de que ocorreu uma mudança no URL, poupando assim um reload completo da página
            iframe.contentWindow.postMessage({
                tipo: 'POPSTATE',
                hash: window.location.hash
            }, '*');
        });
    </script>

</body>
</html>
