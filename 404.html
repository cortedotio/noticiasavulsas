<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Avulsas - A Redirecionar...</title>
    
    <!-- Este comando transporta o utilizador instantaneamente para o portal real -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwK6s2o5pTd0KVCdKa8LjeEYI43YnW0axXXkyB_Q9btGvx1wCFLFEredmZC6LkiD0I/exec" />
    
    <script>
        // Backup: Se o meta refresh falhar, o JavaScript faz o transporte
        window.onload = function() {
            window.location.href = "https://script.google.com/macros/s/AKfycbwK6s2o5pTd0KVCdKa8LjeEYI43YnW0axXXkyB_Q9btGvx1wCFLFEredmZC6LkiD0I/exec";
        };
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #475569;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #E11D48; /* Vermelho Jornal */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>Notícias Avulsas</h2>
        <p>A entrar no portal...</p>
    </div>
</body>
</html>
