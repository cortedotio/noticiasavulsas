<!DOCTYPE html>
<html lang="pt-PT" style="margin: 0; padding: 0; height: 100%; overflow: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Avulsas - Portal</title>
    <style>
        /* Tira as margens e esconde a barra de rolagem lateral nativa, o iframe faz o scroll */
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #f1f2f5; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    
    <!-- Este Iframe carrega secretamente a sua interface do Google -->
    <iframe id="portal-frame" allowfullscreen></iframe>
    
    <script>
        // ⚠️ COLE AQUI O SEU LINK DE EXECUÇÃO DO GOOGLE APPS SCRIPT
        const URL_DO_SEU_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbyNZbWrueHgYf6pwrJcjTyYUWsvW8wukmPm5XDPJHTheTxSmdQooS2_FVCNYlsBKRNw/exec";
        
        const iframe = document.getElementById("portal-frame");
        
        // 1. Inicia o Iframe lendo a URL atual do GitHub (para abrir notícias diretas enviadas por link)
        iframe.src = URL_DO_SEU_WEB_APP_GOOGLE + window.location.search;

        // 2. Fica a escutar as navegações dentro do Iframe
        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'NAVEGACAO') {
                // Altera a URL do navegador principal (ex: ?categoria=Esportes) sem dar refresh!
                if (window.location.search !== event.data.search) {
                    window.history.pushState({}, '', window.location.pathname + event.data.search);
                }
            }
        });

        // 3. Se o utilizador clicar na seta de "Voltar" ou "Avançar" do navegador
        window.addEventListener('popstate', function(event) {
            // Manda o Iframe carregar a página correspondente à URL para a qual voltámos
            iframe.src = URL_DO_SEU_WEB_APP_GOOGLE + window.location.search;
        });
    </script>

</body>
</html>
