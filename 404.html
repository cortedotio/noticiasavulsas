<!DOCTYPE html>
<html lang="pt-PT" style="margin: 0; padding: 0; height: 100%; overflow: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Avulsas - Portal de Informação</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #f1f2f5; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    
    <iframe id="portal-frame" allowfullscreen></iframe>
    
    <script>
        // ⚠️ COLE AQUI O SEU NOVO LINK GERADO NO PASSO 1 (Mantenha as aspas "")
        const URL_DO_SEU_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbw4h9qo2E_myErw68UdFOmdmt_lExylcy2sl0qVNwqhPwg9z959Pu919vbJ5i1qY-t5/exec";
        
        const iframe = document.getElementById("portal-frame");
        
        function getIframeUrl() {
            let path = window.location.pathname; 
            let query = '';
            
            if (path.startsWith('/noticia/')) {
                let id = path.split('/noticia/')[1];
                if(id && id.endsWith('/')) id = id.slice(0, -1);
                query = '?noticia=' + id;
            } else if (path.startsWith('/categoria/')) {
                let cat = path.split('/categoria/')[1];
                if(cat && cat.endsWith('/')) cat = cat.slice(0, -1);
                query = '?categoria=' + encodeURIComponent(decodeURIComponent(cat));
            } else if (path.startsWith('/pesquisa/')) {
                let termo = path.split('/pesquisa/')[1];
                if(termo && termo.endsWith('/')) termo = termo.slice(0, -1);
                query = '?pesquisa=' + encodeURIComponent(decodeURIComponent(termo));
            }
            
            // Adiciona um quebrador de cache para forçar o Chrome a não mostrar a carinha triste antiga
            let cacheBuster = "cb=" + new Date().getTime();
            let finalSeparator = query === '' ? '?' : '&';
            
            return URL_DO_SEU_WEB_APP_GOOGLE + query + finalSeparator + cacheBuster;
        }

        iframe.src = getIframeUrl();

        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'NAVEGACAO') {
                let newPath = '/';
                
                if (event.data.noticiaId) {
                    newPath = '/noticia/' + event.data.noticiaId;
                } else if (event.data.pesquisa) {
                    newPath = '/pesquisa/' + encodeURIComponent(event.data.pesquisa);
                } else if (event.data.categoria && event.data.categoria !== 'Todas' && event.data.categoria !== 'Pesquisa') {
                    newPath = '/categoria/' + encodeURIComponent(event.data.categoria);
                }
                
                if (window.location.pathname !== newPath) {
                    window.history.pushState(null, '', newPath);
                }
            }
        });

        window.addEventListener('popstate', function(event) {
            iframe.src = getIframeUrl();
        });
    </script>

</body>
</html>
