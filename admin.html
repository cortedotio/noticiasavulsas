    <!-- PONTE FIREBASE (O NOVO MOTOR) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        // As suas Chaves Oficiais!
        const firebaseConfig = {
            apiKey: "AIzaSyD7HqJYDLlREM2OV3dofdKgyBXLJ_OdD0M",
            authDomain: "noticias-avulsas.firebaseapp.com",
            projectId: "noticias-avulsas",
            storageBucket: "noticias-avulsas.firebasestorage.app",
            messagingSenderId: "632608657227",
            appId: "1:632608657227:web:d88d071fd8b92d08c0e2ce"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        function formatDateStr(dt) {
            const d = String(dt.getDate()).padStart(2, '0');
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const y = dt.getFullYear();
            const h = String(dt.getHours()).padStart(2, '0');
            const min = String(dt.getMinutes()).padStart(2, '0');
            return `${d}/${m}/${y} ${h}:${min}`;
        }

        window.firebaseBridge = {
            init: async function() {
                if (!auth.currentUser) await signInAnonymously(auth);
            },
            getHomeData: async function() {
                await this.init();
                const res = { sucesso: true, noticias: [], categorias: [], comentarios: [], propagandas: [], config: {} };
                try {
                    const [noticiasSnap, catSnap, configSnap, propSnap, comSnap] = await Promise.all([
                        getDocs(collection(db, 'Noticias')), getDocs(collection(db, 'Categorias')),
                        getDocs(collection(db, 'Configuracoes')), getDocs(collection(db, 'Propagandas')),
                        getDocs(collection(db, 'Comentarios'))
                    ]);

                    noticiasSnap.forEach(d => res.noticias.push({id: d.id, ...d.data()}));
                    catSnap.forEach(d => res.categorias.push(d.id));
                    configSnap.forEach(d => res.config[d.id] = d.data().valor);
                    propSnap.forEach(d => res.propagandas.push({id: d.id, ...d.data()}));
                    comSnap.forEach(d => res.comentarios.push({id: d.id, ...d.data()}));

                    res.noticias.sort((a,b) => {
                        function parse(s) {
                            if(!s) return 0;
                            const p = s.split(/[\/\s:\-T]/);
                            if(p.length < 5) return 0;
                            const ano = p[2].length === 4 ? p[2] : p[0];
                            const dia = p[0].length <= 2 ? p[0] : p[2];
                            return new Date(ano, p[1]-1, dia, p[3], p[4]).getTime();
                        }
                        return parse(b.dataHora) - parse(a.dataHora);
                    });
                    return res;
                } catch (err) { return { sucesso: false, erro: err.message }; }
            },
            verificarLogin: async function(u, p) {
                await this.init();
                try {
                    if (u === 'admin' && p === '123456') return { sucesso: true, role: 'admin', usuario: 'admin' };
                    const snap = await getDocs(collection(db, 'Admins'));
                    let found = false; let role = 'admin';
                    snap.forEach(d => { if (d.id === u && d.data().senha === p) { found = true; role = d.data().role || 'admin'; } });
                    if (found) return { sucesso: true, role: role, usuario: u };
                    return { sucesso: false, erro: "Credenciais inválidas." };
                } catch(e) { return { sucesso: false, erro: e.message }; }
            },
            salvarUsuario: async function(payload) {
                await this.init();
                await setDoc(doc(db, 'Admins', payload.usuario), { senha: payload.senha, role: payload.role || 'admin' });
                return { sucesso: true };
            },
            salvarNoticiaNoSheets: async function(payload) {
                await this.init();
                try {
                    const id = payload.id || new Date().getTime().toString();
                    let urlImagemFinal = payload.urlImagem || "";

                    if (payload.isUpload && payload.base64) {
                        const fileRef = storageRef(storage, `imagens_noticias/${id}_${new Date().getTime()}`);
                        await uploadString(fileRef, payload.base64, 'base64', { contentType: payload.mimeType || 'image/jpeg' });
                        urlImagemFinal = await getDownloadURL(fileRef);
                    }

                    let dataRegistro = ""; let statusFinal = payload.statusForcado || 'Ativa';
                    if (payload.dataAgendamento) {
                        const dt = new Date(payload.dataAgendamento);
                        if (dt > new Date()) statusFinal = 'Agendada';
                        dataRegistro = formatDateStr(dt);
                    } else { dataRegistro = formatDateStr(new Date()); }

                    const docData = {
                        id: id, titulo: payload.titulo || 'Sem Título', categoria: payload.categoria || 'Geral',
                        cidade: payload.cidade || '', linhaFina: payload.linhaFina || '', conteudo: payload.conteudo || '',
                        autor: payload.autor || 'da redação', dataHora: payload.dataHora || dataRegistro,
                        dataFimEvento: payload.dataFimEvento || '', legendaImagem: payload.legendaImagem || '',
                        creditosImagem: payload.creditosImagem || '', relacionadas: payload.relacionadas || '',
                        status: statusFinal, usuarioPublicador: payload.usuarioPublicador || 'admin',
                        noCarrossel: String(payload.noCarrossel), likes: payload.likes || 0, views: payload.views || 0
                    };
                    if (urlImagemFinal) docData.urlImagem = urlImagemFinal;

                    await setDoc(doc(db, 'Noticias', id), docData, { merge: true });
                    return { sucesso: true, id: id };
                } catch (e) { return { sucesso: false, erro: e.message }; }
            },
            alternarStatusNoticia: async function(id) {
                await this.init();
                const ref = doc(db, 'Noticias', id); const snap = await getDoc(ref);
                if (snap.exists()) {
                    const st = snap.data().status === 'Ativa' ? 'Inativa' : 'Ativa';
                    await updateDoc(ref, { status: st }); return { sucesso: true, novoStatus: st };
                }
                return { sucesso: false };
            },
            excluirNoticia: async function(id) {
                await this.init(); await deleteDoc(doc(db, 'Noticias', id)); return { sucesso: true };
            },
            adicionarCategoriaNoSheets: async function(p) {
                await this.init(); await setDoc(doc(db, 'Categorias', p.nome), { nome: p.nome }); return { sucesso: true };
            },
            salvarConfiguracaoHTMLCustom: async function(k, v) {
                await this.init(); await setDoc(doc(db, 'Configuracoes', k), { valor: v }); return { sucesso: true };
            },
            salvarPropagandaNoSheets: async function(payload) {
                await this.init();
                try {
                    const id = new Date().getTime().toString();
                    let urlFinal = payload.urlArquivo || ""; let tipoFinal = payload.tipo || "imagem";
                    if (payload.isUpload && payload.base64) {
                        const fileRef = storageRef(storage, `propagandas/${id}`);
                        await uploadString(fileRef, payload.base64, 'base64', { contentType: payload.mimeType });
                        urlFinal = await getDownloadURL(fileRef);
                        tipoFinal = payload.mimeType.includes("video") ? "video" : "imagem";
                    }
                    await setDoc(doc(db, 'Propagandas', id), { empresa: payload.empresa, urlArquivo: urlFinal, tipo: tipoFinal, local: payload.local, linkDestino: payload.linkDestino, status: 'Ativa' });
                    return { sucesso: true };
                } catch(e) { return { sucesso: false, erro: e.message }; }
            },
            chamarGeminiBackend: async function(prompt) {
                await this.init();
                const confRef = await getDoc(doc(db, 'Configuracoes', 'ChaveIA'));
                const key = confRef.exists() ? confRef.data().valor : '';
                if (!key) return { sucesso: false, erro: "Chave IA não configurada." };
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const json = await res.json();
                if (json.candidates && json.candidates[0].content) return { sucesso: true, texto: json.candidates[0].content.parts[0].text };
                return { sucesso: false, erro: "A IA não conseguiu responder." };
            }
        };
    </script>

    <script>
        // TRADUTOR: Redireciona o antigo código para o Firebase perfeitamente
        window.google = { script: { run: {
            withSuccessHandler: function(cb) { this._onSuccess = cb; return this; },
            withFailureHandler: function(cb) { this._onFailure = cb; return this; }
        }}};

        const apiFunctions = ['getHomeData', 'verificarLogin', 'salvarNoticiaNoSheets', 'alternarStatusNoticia', 'excluirNoticia', 'adicionarCategoriaNoSheets', 'chamarGeminiBackend', 'salvarUsuario', 'salvarConfiguracaoHTMLCustom', 'salvarPropagandaNoSheets'];
        apiFunctions.forEach(function(funcName) {
            window.google.script.run[funcName] = function() {
                var argsArray = Array.prototype.slice.call(arguments);
                var successCb = this._onSuccess; var failureCb = this._onFailure;
                this._onSuccess = null; this._onFailure = null;
                
                var checkReady = setInterval(function() {
                    if (window.firebaseBridge && window.firebaseBridge[funcName]) {
                        clearInterval(checkReady);
                        window.firebaseBridge[funcName].apply(window.firebaseBridge, argsArray)
                            .then(function(res) { if (successCb) successCb(res); })
                            .catch(function(err) { if (failureCb) failureCb(err); });
                    }
                }, 50);
            };
        });

        var configureTailwind = function() {
            if (typeof tailwind === 'undefined') { setTimeout(configureTailwind, 10); return; }
            tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Merriweather', 'serif'] }, colors: { jornal: { blue: '#0F172A', red: '#E11D48', gray: '#F8FAFC', dark: '#020617' } } } } };
        };
        configureTailwind();
    </script>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 bg-gray-50 border border-gray-200 rounded-sm">
                        <div>
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-3 block">Upload da Foto de Capa</label>
                            <input type="file" id="admin-arquivo-imagem" accept="image/*" class="w-full text-sm file:mr-3 file:py-2 file:px-4 file:border-0 file:text-[10px] file:font-black file:uppercase file:bg-jornal-dark file:text-white cursor-pointer rounded-sm bg-white border border-gray-300" onchange="verificarUploadMedia(this)" />
                            <img id="preview-imagem" loading="lazy" src="" class="mt-4 w-full h-40 object-contain bg-gray-900 rounded-sm hidden shadow-inner" />
                        </div>
                        
                        <div class="flex flex-col gap-6">
                            <div>
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 block mb-2">Agendamento</label>
                                <input type="datetime-local" id="admin-agendamento" class="w-full px-4 py-2.5 bg-white border border-gray-300 focus:outline-none text-xs font-bold rounded-sm" />
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase tracking-widest text-rose-600 block mb-2">Fim do Evento</label>
                                <input type="datetime-local" id="admin-data-fim-evento" class="w-full px-4 py-2.5 bg-white border border-gray-300 focus:outline-none text-xs font-bold rounded-sm" />
                            </div>
                        </div>
                    </div>

                    <div id="admin-imagem-metadados" class="hidden p-6 bg-amber-50 border border-amber-200 rounded-sm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="text-[10px] font-bold uppercase tracking-widest text-gray-600 mb-2 block">Legenda (Opcional)</label>
                                <input type="text" id="admin-legenda-imagem" class="w-full px-4 py-2 bg-white border border-gray-300 text-sm focus:outline-none rounded-sm" />
                            </div>
                            <div>
                                <label class="text-[10px] font-bold uppercase tracking-widest text-red-600 mb-2 block">Créditos / Fonte da Imagem *</label>
                                <input type="text" id="admin-creditos-imagem" class="w-full px-4 py-2 bg-white border border-red-300 text-sm font-bold focus:outline-none rounded-sm" />
                            </div>
                        </div>
                    </div>

                    <div class="p-5 bg-sky-50 border border-sky-100 rounded-sm">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="admin-carrossel" class="w-5 h-5 text-jornal-blue border-gray-300 rounded focus:ring-jornal-blue" />
                            <span class="text-sm font-black text-jornal-dark uppercase tracking-widest block">Adicionar ao Carrossel de Destaques</span>
                        </label>
                    </div>

                    <div class="pt-6 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                        <button type="button" onclick="limparFormNoticia()" class="text-xs font-black text-gray-500 hover:text-jornal-red uppercase tracking-widest py-2">Limpar Form</button>
                        <button type="submit" id="btn-salvar-noticia" onclick="salvarNoticia(event)" class="w-full md:w-auto bg-jornal-dark text-white font-black px-12 py-4 uppercase tracking-widest text-sm rounded-sm">Publicar Matéria</button>
                    </div>
                </form>
            </div>

            <!-- LISTAGEM -->
            <div id="lista-noticias-container" class="hidden bg-white p-6 shadow-sm border border-gray-200 rounded-sm">
                <div class="border-l-4 border-jornal-red pl-3 mb-6">
                    <h2 class="font-sans text-xl font-black text-jornal-dark uppercase tracking-tighter">Editar Publicações</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-gray-50 border border-gray-200 rounded-sm">
                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-1 block">Filtrar por editoria</label>
                        <select id="admin-filtro-editoria" onchange="carregarListaEdicao()" class="w-full px-4 py-3 bg-white border border-gray-300 focus:outline-none text-sm font-bold text-jornal-dark rounded-sm">
                            <option value="todas">Todas as editorias</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-1 block">Pesquisar matéria</label>
                        <input type="search" id="admin-pesquisa-materia" oninput="carregarListaEdicao()" placeholder="Digite título ou conteúdo..." class="w-full px-4 py-3 bg-white border border-gray-300 focus:outline-none text-sm text-jornal-dark rounded-sm" />
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-100 border-b border-gray-300 text-[10px] uppercase tracking-widest text-gray-500">
                            <tr>
                                <th class="p-4">Data</th>
                                <th class="p-4">Editorias</th>
                                <th class="p-4">Manchete</th>
                                <th class="p-4 text-center">Visibilidade</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="admin-tabela-noticias" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPTS CORE -->
    <script>
        var noticiasGlobais = [];
        var listaCategoriasLocais = [];
        var base64StringNoticia = ""; var mimeStringNoticia = ""; var nameStringNoticia = "";
        window.usuarioLogado = 'admin'; window.roleLogado = 'admin';
        var rangeSalvo = null;

        document.addEventListener('selectionchange', function() {
            var sel = window.getSelection();
            if (sel.rangeCount > 0) {
                var ativo = document.activeElement;
                if (ativo && ativo.id === 'admin-editor-rich') rangeSalvo = sel.getRangeAt(0);
            }
        });

        function restaurarSelecao() {
            if (rangeSalvo) {
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(rangeSalvo);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem('admin_logado') === 'true') {
                window.usuarioLogado = localStorage.getItem('admin_user') || 'admin';
                document.getElementById('modalLogin').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                carregarNoticiasAdmin();
            } else {
                document.getElementById('loading-global').classList.add('hidden');
                document.getElementById('modalLogin').classList.remove('hidden');
                document.getElementById('modalLogin').classList.add('flex');
            }
            
            var editorRich = document.getElementById('admin-editor-rich');
            if (editorRich) {
                editorRich.addEventListener('click', function(e) {
                    var el = e.target;
                    if (el && (el.classList.contains('btn-diminuir-img') || el.classList.contains('btn-aumentar-img'))) {
                        e.preventDefault(); e.stopPropagation();
                        var figure = el.closest('figure');
                        var img = figure ? figure.querySelector('img') : null;
                        if (img) {
                            var currentWidthStr = img.style.width || img.width + 'px';
                            var val = parseFloat(currentWidthStr);
                            var isPercent = currentWidthStr.indexOf('%') !== -1;
                            if (isNaN(val)) { val = 300; isPercent = false; }
                            var step = isPercent ? 10 : 50; 
                            if (el.classList.contains('btn-aumentar-img')) { val += step; } else { val -= step; if(val < 50) val = 50; }
                            if (isPercent && val > 100) val = 100;
                            img.style.width = val + (isPercent ? '%' : 'px');
                            img.style.maxWidth = '100%';
                        }
                    }
                });
                editorRich.addEventListener('keyup', atualizarBarraFerramentas);
                editorRich.addEventListener('mouseup', atualizarBarraFerramentas);
            }
        });

        function mostrarMensagem(mensagem, tipo) {
            var toast = document.getElementById('toast'); 
            document.getElementById('toast-msg').innerText = mensagem;
            toast.className = tipo === 'erro' ? 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-white border-red-600 text-red-600 rounded-sm' : 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-jornal-dark border-jornal-dark text-white rounded-sm'; 
            document.getElementById('toast-icon').innerText = tipo === 'erro' ? '⚠️' : '✓';
            toast.classList.remove('hidden'); 
            setTimeout(function() { toast.classList.add('hidden'); }, 4500);
        }

        function fazerLogin(e) {
            e.preventDefault();
            var u = document.getElementById('login-user').value; 
            var p = document.getElementById('login-pass').value;
            var btn = document.getElementById('btn-fazer-login'); 
            btn.innerHTML = "A VERIFICAR..."; btn.disabled = true;

            var checkReady = setInterval(function() {
                if (window.firebaseBridge) {
                    clearInterval(checkReady);
                    window.firebaseBridge.verificarLogin(u, p).then(function(res) {
                        if (res && res.sucesso) {
                            window.usuarioLogado = res.usuario || u; 
                            localStorage.setItem('admin_logado', 'true'); 
                            localStorage.setItem('admin_user', window.usuarioLogado); 
                            document.getElementById('modalLogin').classList.add('hidden'); 
                            document.getElementById('view-admin').classList.remove('hidden');
                            carregarNoticiasAdmin();
                        } else { 
                            mostrarMensagem(res ? res.erro : "Resposta inválida.", 'erro'); 
                            btn.innerHTML = "Entrar no Painel"; btn.disabled = false; 
                        }
                    }).catch(function(erro) {
                        mostrarMensagem("Falha na rede.", 'erro'); btn.innerHTML = "Entrar no Painel"; btn.disabled = false;
                    });
                }
            }, 100);
        }

        function encerrarSessao() {
            localStorage.removeItem('admin_logado'); localStorage.removeItem('admin_user'); 
            window.location.href = "index.html";
        }

        function alternarAbaAdmin(abaId) {
            ['form-noticia-container', 'lista-noticias-container'].forEach(function(id) { var el = document.getElementById(id); if (el) el.classList.add('hidden'); });
            ['aba-noticia', 'aba-lista'].forEach(function(id) { var el = document.getElementById(id); if (el) el.className = "py-3 px-5 font-bold text-[11px] bg-gray-200 text-gray-500 hover:text-gray-800 hover:bg-gray-300 uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors"; });
            var targetEl = document.getElementById(abaId); if(targetEl) targetEl.classList.remove('hidden');
            var botaoId = abaId === 'form-noticia-container' ? 'aba-noticia' : 'aba-lista'; 
            var classAtiva = abaId === 'form-noticia-container' ? "bg-jornal-blue text-white font-black" : "bg-jornal-dark text-white font-black";
            if (abaId === 'lista-noticias-container') carregarListaEdicao(); 
            var btnEl = document.getElementById(botaoId); if(btnEl) btnEl.className = `py-3 px-5 uppercase tracking-widest text-[11px] whitespace-nowrap rounded-t-sm transition-colors ${classAtiva}`;
        }

        function carregarNoticiasAdmin() {
            var loader = document.getElementById('loading-global'); loader.classList.remove('hidden');
            
            var checkReady = setInterval(function() {
                if (window.firebaseBridge) {
                    clearInterval(checkReady);
                    window.firebaseBridge.getHomeData().then(function(res) {
                        loader.classList.add('hidden');
                        if (res && res.sucesso) {
                            noticiasGlobais = res.noticias || []; 
                            if (res.categorias && res.categorias.length > 0) listaCategoriasLocais = res.categorias;
                            renderizarChecklistCategoriasAdmin();
                            if (!document.getElementById('lista-noticias-container').classList.contains('hidden')) carregarListaEdicao();
                        } else { mostrarMensagem("Erro ao carregar dados.", 'erro'); }
                    });
                }
            }, 100);
        }

        function renderizarChecklistCategoriasAdmin() {
            var checklistAdmin = document.getElementById('admin-categoria-checklist'); if(!checklistAdmin) return;
            checklistAdmin.innerHTML = '';
            listaCategoriasLocais.forEach(function(c) {
                if (!c) return; var nomeCat = String(c).trim();
                checklistAdmin.innerHTML += `<label class="flex items-center gap-3 cursor-pointer text-xs font-bold text-slate-700 p-2 hover:bg-gray-100 rounded transition-colors"><input type="checkbox" name="admin-categorias-checkbox" value="${nomeCat}" onchange="atualizarCampoCidadeAdmin();" class="w-4 h-4 text-jornal-blue rounded border-gray-400" /> ${nomeCat.toUpperCase()}</label>`;
            });
        }

        function normalizarTexto(str) { return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }

        function atualizarCampoCidadeAdmin() {
            var selecionadas = Array.from(document.querySelectorAll('input[name="admin-categorias-checkbox"]:checked'));
            var mostraCidade = selecionadas.some(function(cb) { return normalizarTexto(cb.value) === 'cidades'; });
            var container = document.getElementById('admin-cidade-container'); var input = document.getElementById('admin-cidade');
            if (container) container.classList.toggle('hidden', !mostraCidade);
            if (input) { input.required = mostraCidade; if (!mostraCidade) input.value = ''; }
        }

        function novaCategoria() {
            var nome = prompt("Escreva o nome da nova editoria:"); if (!nome) return;
            window.firebaseBridge.adicionarCategoriaNoSheets({nome: nome}).then(function(res){
                if(res.sucesso) { mostrarMensagem("Editoria adicionada!"); if(listaCategoriasLocais.indexOf(nome) === -1) listaCategoriasLocais.push(nome); renderizarChecklistCategoriasAdmin(); }
            });
        }

        function execCmd(command, arg) { 
            if(arg === undefined) arg = null; 
            if(command === 'fontName' || command === 'fontSize') restaurarSelecao();
            document.execCommand(command, false, arg); document.getElementById('admin-editor-rich').focus(); atualizarBarraFerramentas(); 
        }
        function aplicarFonte(valor) { if (!valor) return; execCmd('fontName', valor); }
        
        function atualizarBarraFerramentas() {
            var editorAtivo = document.getElementById('admin-editor-rich'); if (!editorAtivo) return;
            var fontNode = document.queryCommandValue('fontName'); var sizeNode = document.queryCommandValue('fontSize');
            var selFont = document.querySelector('.fontFamilySelect'); var selSize = document.querySelector('.fontSizeSelect');
            if (fontNode && selFont) { var fontL = fontNode.replace(/['"]/g, '').toLowerCase().split(',')[0]; for(var i=0; i<selFont.options.length; i++) { if(selFont.options[i].value.toLowerCase().includes(fontL)) { selFont.selectedIndex = i; break; } } }
            if (sizeNode && selSize) { for(var j=0; j<selSize.options.length; j++) { if(selSize.options[j].value === sizeNode.toString()) { selSize.selectedIndex = j; break; } } }
        }
        
        function limparFormatacao(btnElement) {
            document.execCommand('removeFormat', false, null); document.execCommand('unlink', false, null);
            var sel = window.getSelection();
            if (!sel.isCollapsed) {
                var range = sel.getRangeAt(0); var container = range.commonAncestorContainer; if (container.nodeType === 3) container = container.parentNode;
                var editor = document.getElementById('admin-editor-rich');
                if (editor) {
                    var elements = container.querySelectorAll('*');
                    elements.forEach(function(el) { if (sel.containsNode(el, true)) { el.removeAttribute('style'); el.removeAttribute('face'); el.removeAttribute('size'); el.removeAttribute('class'); el.removeAttribute('color'); } });
                    if (container !== editor) { container.removeAttribute('style'); container.removeAttribute('face'); container.removeAttribute('size'); container.removeAttribute('class'); container.removeAttribute('color'); }
                    var selFont = document.querySelector('.fontFamilySelect'); var selSize = document.querySelector('.fontSizeSelect');
                    if(selFont) selFont.selectedIndex = 0; if(selSize) selSize.selectedIndex = 0; editor.focus();
                }
            }
        }

        function inserirImagemRichEditor() { document.getElementById('upload-imagem-conteudo').click(); }

        function processarUploadImagemConteudo(input) {
            if (!input.files || !input.files[0]) return; var file = input.files[0]; var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas'); var ctx = canvas.getContext('2d'); var maxWidth = 500; var scale = 1;
                    if (img.width > maxWidth) scale = maxWidth / img.width;
                    canvas.width = img.width * scale; canvas.height = img.height * scale; ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    var base64Resized = canvas.toDataURL('image/jpeg', 0.6); 
                    var htmlImg = `<br><figure style="margin: 16px auto; text-align: center; max-width: 100%; display: block;"><img src="${base64Resized}" style="max-width: 100%; height: auto; border-radius: 8px; display: inline-block; margin: 0 auto; border: 1px solid #e2e8f0;" /></figure><br><p>&#8203;</p>`; 
                    execCmd('insertHTML', htmlImg); input.value = '';
                }; img.src = e.target.result;
            }; reader.readAsDataURL(file);
        }

        function verificarUploadMedia(input) {
            var containerMetadados = document.getElementById('admin-imagem-metadados'); var inputCreditos = document.getElementById('admin-creditos-imagem');
            if (input && input.files && input.files[0]) { if (containerMetadados) containerMetadados.classList.remove('hidden'); if (inputCreditos) inputCreditos.required = true; } 
            else { var prevSrc = document.getElementById('preview-imagem').src; if (!prevSrc || prevSrc === "") { if (containerMetadados) containerMetadados.classList.add('hidden'); if (inputCreditos) inputCreditos.required = false; } }
        }

        var adminArquivoInput = document.getElementById('admin-arquivo-imagem');
        if(adminArquivoInput) {
            adminArquivoInput.addEventListener('change', function(e) {
                var file = e.target.files[0]; if (!file) { base64StringNoticia = ""; return; }
                mimeStringNoticia = file.type; nameStringNoticia = file.name;
                var reader = new FileReader(); 
                reader.onload = function(evt) { base64StringNoticia = evt.target.result.split(',')[1]; document.getElementById('preview-imagem').src = evt.target.result; document.getElementById('preview-imagem').classList.remove('hidden'); verificarUploadMedia(e.target); }; 
                reader.readAsDataURL(file);
            });
        }

        function limparFormNoticia() {
            document.getElementById('form-admin').reset(); document.getElementById('admin-id-noticia').value = ""; document.getElementById('preview-imagem').classList.add('hidden'); document.getElementById('preview-imagem').src = ""; document.getElementById('admin-editor-rich').innerHTML = ""; document.getElementById('admin-imagem-metadados').classList.add('hidden'); document.getElementById('admin-creditos-imagem').required = false; base64StringNoticia = ""; document.querySelectorAll('input[name="admin-categorias-checkbox"]').forEach(function(cb) { cb.checked = false; }); atualizarCampoCidadeAdmin(); 
            var btnSalvar = document.getElementById('btn-salvar-noticia'); if (btnSalvar) btnSalvar.innerText = "PUBLICAR MATÉRIA"; document.getElementById('titulo-pagina-form').innerText = "Redigir Matéria";
        }

        function salvarNoticia(e) {
            if(e) e.preventDefault(); 
            var editandoID = document.getElementById('admin-id-noticia').value; var prevSrc = document.getElementById('preview-imagem').src; var temImagemAnterior = prevSrc && prevSrc !== "";
            var checkboxes = document.querySelectorAll('input[name="admin-categorias-checkbox"]:checked'); 
            var tituloDigitado = document.getElementById('admin-titulo').value.trim(); var creditos = document.getElementById('admin-creditos-imagem').value.trim();
            
            if (!tituloDigitado || checkboxes.length === 0) { mostrarMensagem("Manchete e Editoria obrigatórias.", "erro"); return; }
            if ((base64StringNoticia || temImagemAnterior) && !creditos) { mostrarMensagem("Crédito de imagem obrigatório.", "erro"); return; }
            
            var categoriasSelecionadas = Array.from(checkboxes).map(function(cb) { return cb.value; }).join(", ");
            var btn = document.getElementById('btn-salvar-noticia'); var txtOriginal = btn.innerHTML; btn.innerHTML = 'A publicar para o Firebase...'; btn.disabled = true;

            var conteudoRich = document.getElementById('admin-editor-rich').innerHTML;
            var tamanhoEmBytes = new Blob([conteudoRich]).size;
            if (tamanhoEmBytes > 800000) { 
                mostrarMensagem("A matéria excede o limite (800KB). Reduza as imagens coladas.", "erro");
                btn.innerHTML = txtOriginal; btn.disabled = false;
                return;
            }

            var tempDiv = document.createElement('div'); tempDiv.innerHTML = conteudoRich;
            var botoesAdmin = tempDiv.querySelectorAll('.controles-imagem-admin, .btn-diminuir-img, .btn-aumentar-img');
            botoesAdmin.forEach(function(btnRem) { var pai = btnRem.parentElement; btnRem.remove(); if (pai && pai.tagName !== 'FIGURE' && pai.innerHTML.trim() === '') pai.remove(); });
            var conteudoLimpo = tempDiv.innerHTML;

            var payload = { 
                id: editandoID, titulo: tituloDigitado, categoria: categoriasSelecionadas, cidade: document.getElementById('admin-cidade') ? document.getElementById('admin-cidade').value : '', 
                linhaFina: document.getElementById('admin-linha-fina').value.trim(), conteudo: conteudoLimpo, 
                autor: document.getElementById('admin-autor').value.trim(), dataAgendamento: document.getElementById('admin-agendamento').value, 
                dataFimEvento: document.getElementById('admin-data-fim-evento').value, legendaImagem: document.getElementById('admin-legenda-imagem').value, 
                creditosImagem: creditos, statusForcado: 'Ativa', noCarrossel: document.getElementById('admin-carrossel').checked,
                usuarioPublicador: window.usuarioLogado
            };
            
            if (base64StringNoticia) { payload.isUpload = true; payload.base64 = base64StringNoticia; payload.mimeType = mimeStringNoticia; payload.fileName = nameStringNoticia; } 
            else if (temImagemAnterior) { payload.urlImagem = prevSrc; payload.isUpload = false; }
            else { payload.isUpload = false; }
            
            window.firebaseBridge.salvarNoticiaNoSheets(payload).then(function(res){
                btn.innerHTML = txtOriginal; btn.disabled = false;
                if(res.sucesso) { mostrarMensagem('Matéria Publicada no Firebase!'); limparFormNoticia(); carregarNoticiasAdmin(); setTimeout(function(){ alternarAbaAdmin('lista-noticias-container'); }, 1000); }
                else { mostrarMensagem("Erro: " + res.erro, "erro"); }
            });
        }

        function carregarListaEdicao() {
            var tbody = document.getElementById('admin-tabela-noticias'); if(!tbody) return; tbody.innerHTML = '';
            var sel = document.getElementById('admin-filtro-editoria'); var term = normalizarTexto(document.getElementById('admin-pesquisa-materia') ? document.getElementById('admin-pesquisa-materia').value : '');
            
            var filtradas = noticiasGlobais.filter(function(n) { 
                var txt = normalizarTexto([n.titulo, n.categoria].join(' ')); return !term || txt.indexOf(term) !== -1; 
            });
            if (filtradas.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-xs text-gray-500 font-bold">Nenhuma matéria.</td></tr>`; return; }
            filtradas.forEach(function(n) {
                var isAtivo = n.status === 'Ativa'; var corStat = isAtivo ? 'text-gray-700' : 'text-gray-400';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="p-4 text-xs font-medium text-gray-500">${n.dataHora || ''}</td>
                        <td class="p-4"><span class="bg-gray-200 text-gray-800 px-2 py-1 rounded-sm text-[9px] uppercase font-black">${n.categoria}</span></td>
                        <td class="p-4 font-bold text-sm text-jornal-dark truncate max-w-[250px]">${n.titulo}</td>
                        <td class="p-4 text-center">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" ${isAtivo ? 'checked' : ''} onchange="alterarStatusRapido('${n.id}', this)" />
                                <div class="w-10 h-5 bg-gray-300 rounded-full peer peer-checked:bg-emerald-500"></div>
                            </label>
                        </td>
                        <td class="p-4 text-center flex gap-2 justify-center">
                            <button onclick="editarNoticia('${n.id}')" class="text-[10px] font-black uppercase text-jornal-blue border border-jornal-blue/30 px-3 py-1.5 rounded-sm hover:bg-jornal-blue hover:text-white">Editar</button>
                            <button onclick="apagarMateria('${n.id}')" class="text-[10px] font-black uppercase text-red-600 border border-red-200 px-3 py-1.5 rounded-sm hover:bg-red-50">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        function alterarStatusRapido(id, checkbox) { window.firebaseBridge.alternarStatusNoticia(id).then(function(res){ if(res.sucesso) carregarNoticiasAdmin(); }); }
        function apagarMateria(id) { if(confirm("Eliminar permanentemente?")) window.firebaseBridge.excluirNoticia(id).then(function(res){ if(res.sucesso) carregarNoticiasAdmin(); }); }

        function editarNoticia(id) {
            var noticia = noticiasGlobais.find(function(n) { return String(n.id) === String(id); }); if(!noticia) return;
            limparFormNoticia(); 
            document.getElementById('admin-id-noticia').value = noticia.id; document.getElementById('admin-titulo').value = noticia.titulo || ''; 
            document.getElementById('admin-linha-fina').value = noticia.linhaFina || ""; document.getElementById('admin-editor-rich').innerHTML = noticia.conteudo || ''; 
            document.getElementById('admin-autor').value = noticia.autor !== "da redação" ? (noticia.autor || '') : ""; 
            var cats = String(noticia.categoria).split(',').map(function(c) { return c.trim().toLowerCase(); }); 
            document.querySelectorAll('input[name="admin-categorias-checkbox"]').forEach(function(cb) { cb.checked = cats.indexOf(cb.value.toLowerCase()) !== -1; }); 
            document.getElementById('admin-legenda-imagem').value = noticia.legendaImagem || ''; document.getElementById('admin-creditos-imagem').value = noticia.creditosImagem || '';
            document.getElementById('admin-carrossel').checked = (String(noticia.noCarrossel) === 'true');
            var prevImg = document.getElementById('preview-imagem'); 
            if (prevImg) { if(noticia.urlImagem) { prevImg.src = noticia.urlImagem; prevImg.classList.remove('hidden'); document.getElementById('admin-imagem-metadados').classList.remove('hidden'); } else { prevImg.classList.add('hidden'); } }
            document.getElementById('titulo-pagina-form').innerText = "Editar Matéria"; alternarAbaAdmin('form-noticia-container'); window.scrollTo(0,0);
        }
    </script>
</body>
</html>
