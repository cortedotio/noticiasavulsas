<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redação - Notícias Avulsas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyVroxyx_f70Q2KkcnfMWtt2vV8EzQRsPBhF9nNL4frnKhdhe7t-oahNoJo9SCLfAbE/exec";
        window.google = { script: { run: { withSuccessHandler: function(cb) { this._onSuccess = cb; return this; }, withFailureHandler: function(cb) { this._onFailure = cb; return this; } } } };
        const apiFunctions = ['getHomeData', 'salvarNoticiaNoSheets', 'alternarStatusNoticia', 'excluirNoticia', 'adicionarCategoriaNoSheets', 'chamarGeminiBackend'];
        apiFunctions.forEach(function(funcName) {
            window.google.script.run[funcName] = function() {
                var argsArray = Array.prototype.slice.call(arguments);
                var successCb = this._onSuccess; var failureCb = this._onFailure;
                this._onSuccess = null; this._onFailure = null;
                fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: funcName, args: argsArray }) })
                .then(r => r.json()).then(result => { if(successCb) successCb(result); }).catch(err => { if(failureCb) failureCb(err); });
            };
        });
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-jornal-dark text-white p-4 border-b border-gray-800">
        <div class="max-w-[1200px] mx-auto flex justify-between items-center">
            <h1 class="font-black text-lg uppercase">Redação</h1>
            <nav class="flex gap-4 text-xs font-bold uppercase">
                <a href="admin.html" class="text-rose-500">Redação</a>
                <a href="config.html" class="hover:text-emerald-400">Configurações</a>
            </nav>
        </div>
    </header>

    <main class="max-w-[1200px] mx-auto p-4 py-8">
        <div id="form-noticia-container" class="bg-white p-6 shadow-sm rounded-sm">
            <h2 class="font-black text-xl mb-6 border-l-4 border-rose-600 pl-3">Publicar Matéria</h2>
            <!-- Aqui inserirá os formulários de Redação -->
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('admin_logado') !== 'true') window.location.href = 'index.html';
        });
    </script>
</body>
</html>
