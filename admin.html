    <!-- PONTE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7HqJYDLlREM2OV3dofdKgyBXLJ_OdD0M",
            authDomain: "noticias-avulsas.firebaseapp.com",
            projectId: "noticias-avulsas",
            storageBucket: "noticias-avulsas.firebasestorage.app",
            messagingSenderId: "632608657227",
            appId: "1:632608657227:web:d88d071fd8b92d08c0e2ce"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        function formatDateStr(dt) {
            const d = String(dt.getDate()).padStart(2, '0');
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const y = dt.getFullYear();
            const h = String(dt.getHours()).padStart(2, '0');
            const min = String(dt.getMinutes()).padStart(2, '0');
            return `${d}/${m}/${y} ${h}:${min}`;
        }

        window.firebaseBridge = {
            getHomeData: async function() {
                try {
                    const res = { sucesso: true, noticias: [], categorias: [], comentarios: [], propagandas: [], config: {} };
                    const [noticiasSnap, catSnap, configSnap, propSnap, comSnap] = await Promise.all([
                        getDocs(collection(db, 'Noticias')), getDocs(collection(db, 'Categorias')),
                        getDocs(collection(db, 'Configuracoes')), getDocs(collection(db, 'Propagandas')),
                        getDocs(collection(db, 'Comentarios'))
                    ]);

                    noticiasSnap.forEach(d => res.noticias.push({id: d.id, ...d.data()}));
                    catSnap.forEach(d => res.categorias.push(d.id));
                    configSnap.forEach(d => res.config[d.id] = d.data().valor);
                    propSnap.forEach(d => res.propagandas.push({id: d.id, ...d.data()}));
                    comSnap.forEach(d => res.comentarios.push({id: d.id, ...d.data()}));

                    res.noticias.sort((a,b) => {
                        function getTs(str) {
                            if(!str) return 0;
                            const dt = new Date(str);
                            if(!isNaN(dt.getTime())) return dt.getTime();
                            const p = str.split(/[\/\s:\-T]/);
                            if(p.length >= 5) {
                                const ano = p[2].length === 4 ? p[2] : p[0];
                                const dia = p[0].length <= 2 ? p[0] : p[2];
                                return new Date(ano, p[1]-1, dia, p[3], p[4]).getTime();
                            }
                            return 0;
                        }
                        return getTs(b.dataHora) - getTs(a.dataHora);
                    });
                    return res;
                } catch (err) { return { sucesso: false, erro: err.message }; }
            },
            verificarLogin: async function(u, p) {
                try {
                    if (u === 'admin' && p === '123456') return { sucesso: true, role: 'admin', usuario: 'admin' };
                    const snap = await getDocs(collection(db, 'Admins'));
                    let found = false; let role = 'admin';
                    snap.forEach(d => { if (d.id === u && d.data().senha === p) { found = true; role = d.data().role || 'admin'; } });
                    if (found) return { sucesso: true, role: role, usuario: u };
                    return { sucesso: false, erro: "Credenciais inválidas." };
                } catch(e) { return { sucesso: false, erro: e.message }; }
            },
            salvarNoticiaNoSheets: async function(payload) {
                try {
                    const id = payload.id || new Date().getTime().toString();
                    let urlImagemFinal = payload.urlImagem || "";

                    if (payload.isUpload && payload.base64) {
                        const fileRef = storageRef(storage, `imagens_noticias/${id}_${new Date().getTime()}`);
                        await uploadString(fileRef, payload.base64, 'base64', { contentType: payload.mimeType || 'image/jpeg' });
                        urlImagemFinal = await getDownloadURL(fileRef);
                    }

                    let dataRegistro = ""; let statusFinal = payload.statusForcado || 'Ativa';
                    if (payload.dataAgendamento) {
                        const dt = new Date(payload.dataAgendamento);
                        if (dt > new Date() && statusFinal === 'Ativa') statusFinal = 'Agendada';
                        dataRegistro = formatDateStr(dt);
                    } else { dataRegistro = payload.dataHora || formatDateStr(new Date()); }

                    const docData = {
                        id: id, titulo: payload.titulo || 'Sem Título', categoria: payload.categoria || 'Geral',
                        cidade: payload.cidade || '', linhaFina: payload.linhaFina || '', conteudo: payload.conteudo || '',
                        autor: payload.autor || 'da redação', dataHora: dataRegistro,
                        dataFimEvento: payload.dataFimEvento || '', legendaImagem: payload.legendaImagem || '',
                        creditosImagem: payload.creditosImagem || '', relacionadas: payload.relacionadas || '',
                        status: statusFinal, usuarioPublicador: payload.usuarioPublicador || 'admin',
                        noCarrossel: String(payload.noCarrossel), likes: payload.likes || 0, views: payload.views || 0
                    };
                    if (urlImagemFinal) docData.urlImagem = urlImagemFinal;

                    await setDoc(doc(db, 'Noticias', id), docData, { merge: true });
                    return { sucesso: true, id: id };
                } catch (e) { return { sucesso: false, erro: e.message }; }
            },
            alternarStatusNoticia: async function(id) {
                try {
                    const ref = doc(db, 'Noticias', id); const snap = await getDoc(ref);
                    if (snap.exists()) {
                        const st = snap.data().status === 'Ativa' ? 'Inativa' : 'Ativa';
                        await updateDoc(ref, { status: st }); return { sucesso: true, novoStatus: st };
                    }
                    return { sucesso: false };
                } catch(e) { return { sucesso: false, erro: e.message }; }
            },
            excluirNoticia: async function(id) { try { await deleteDoc(doc(db, 'Noticias', id)); return { sucesso: true }; } catch(e) { return { sucesso: false, erro: e.message }; } },
            adicionarCategoriaNoSheets: async function(p) { try { await setDoc(doc(db, 'Categorias', p.nome), { nome: p.nome }); return { sucesso: true }; } catch(e) { return { sucesso: false, erro: e.message }; } }
        };
    </script>

                    <div class="p-6 bg-[#f8fafc] border border-gray-200 rounded-sm">
                        <label class="flex items-center gap-4 cursor-pointer">
                            <input type="checkbox" id="admin-carrossel" class="w-5 h-5 text-[#0f172a] border-gray-400 rounded focus:ring-[#0f172a]" />
                            <span class="text-xs font-black text-[#020617] uppercase tracking-widest block">ADICIONAR AO CARROSSEL DE DESTAQUES</span>
                        </label>
                    </div>

                    <div class="pt-8 mt-8 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                        <button type="button" onclick="limparFormNoticia()" class="text-[11px] font-black text-gray-500 hover:text-gray-800 uppercase tracking-widest py-3 px-6 transition-all">LIMPAR FORM</button>
                        <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                            <button type="button" onclick="salvarRascunho()" class="w-full md:w-auto bg-[#94a3b8] hover:bg-[#64748b] text-white font-black px-10 py-4 uppercase tracking-widest text-sm rounded-sm shadow-md transition-colors">SALVAR RASCUNHO</button>
                            <button type="submit" id="btn-salvar-noticia" onclick="salvarNoticia(event)" class="w-full md:w-auto bg-[#020617] hover:bg-[#1e293b] text-white font-black px-12 py-4 uppercase tracking-widest text-sm rounded-sm shadow-xl transition-colors">PUBLICAR MATÉRIA</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- 2. LISTAGEM (GERIR MATÉRIAS) -->
            <div id="lista-noticias-container" class="bg-white p-8 shadow-sm border border-gray-200 rounded-sm">
                <div class="border-l-4 border-jornal-red pl-4 mb-8">
                    <h2 class="font-sans text-2xl font-black text-jornal-dark uppercase tracking-tighter">EDITAR PUBLICAÇÕES</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 p-6 bg-white border border-gray-200 rounded-sm">
                    <div>
                        <label class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-2 block">FILTRAR POR EDITORIA</label>
                        <select id="admin-filtro-editoria" onchange="carregarListaEdicao()" class="w-full px-5 py-3.5 bg-white border border-gray-300 focus:outline-none focus:border-jornal-dark text-sm font-bold text-gray-700 rounded-sm shadow-sm transition-colors">
                            <option value="todas">Todas as editorias</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-2 block">PESQUISAR MATÉRIA</label>
                        <input type="search" id="admin-pesquisa-materia" oninput="carregarListaEdicao()" placeholder="Digite título ou conteúdo..." class="w-full px-5 py-3.5 bg-white border border-gray-300 focus:outline-none focus:border-jornal-dark text-sm font-bold text-gray-700 rounded-sm shadow-sm transition-colors" />
                    </div>
                </div>
                
                <div class="overflow-x-auto border border-gray-200 rounded-sm">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-[#f8fafc] border-b border-gray-200 text-[10px] uppercase font-black tracking-widest text-gray-500">
                            <tr>
                                <th class="p-5 w-[110px]">DATA</th>
                                <th class="p-5">EDITORIAS</th>
                                <th class="p-5">MANCHETE</th>
                                <th class="p-5">AUTOR</th>
                                <th class="p-5">PUBLICADOR</th>
                                <th class="p-5 text-center">VISÕES</th>
                                <th class="p-5 text-center w-[140px]">VISIBILIDADE</th>
                                <th class="p-5 text-center w-[160px]">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="admin-tabela-noticias" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPTS CORE -->
    <script>
        var noticiasGlobais = [];
        var listaCategoriasLocais = [];
        var base64StringNoticia = ""; var mimeStringNoticia = ""; var nameStringNoticia = "";
        window.usuarioLogado = 'admin';
        window.relacionadasSelecionadas = [];

        document.addEventListener("DOMContentLoaded", function() {
            var loader = document.getElementById('loading-global');
            setTimeout(function() {
                if (loader && !loader.classList.contains('hidden')) {
                    loader.classList.add('hidden');
                    document.getElementById('modalLogin').classList.remove('hidden');
                    document.getElementById('modalLogin').classList.add('flex');
                }
            }, 5000);

            if (localStorage.getItem('admin_logado') === 'true') {
                window.usuarioLogado = localStorage.getItem('admin_user') || 'ADMIN';
                var lbl = document.getElementById('label-usuario-logado'); if(lbl) lbl.innerText = window.usuarioLogado.toUpperCase();
                document.getElementById('modalLogin').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                carregarNoticiasAdmin();
            } else {
                loader.classList.add('hidden');
                document.getElementById('modalLogin').classList.remove('hidden');
                document.getElementById('modalLogin').classList.add('flex');
            }
        });

        function mostrarMensagem(mensagem, tipo) {
            var toast = document.getElementById('toast'); 
            document.getElementById('toast-msg').innerText = mensagem;
            toast.className = tipo === 'erro' ? 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-white border-red-600 text-red-600 rounded-sm' : 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-[#0f172a] border-[#0f172a] text-white rounded-sm'; 
            document.getElementById('toast-icon').innerText = tipo === 'erro' ? '⚠️' : '✓';
            toast.classList.remove('hidden'); 
            setTimeout(function() { toast.classList.add('hidden'); }, 4500);
        }

        function fazerLogin(e) {
            e.preventDefault();
            var u = document.getElementById('login-user').value; 
            var p = document.getElementById('login-pass').value;
            var btn = document.getElementById('btn-fazer-login'); 
            btn.innerHTML = "A VERIFICAR..."; btn.disabled = true;

            var checkReady = setInterval(function() {
                if (window.firebaseBridge) {
                    clearInterval(checkReady);
                    window.firebaseBridge.verificarLogin(u, p).then(function(res) {
                        if (res && res.sucesso) {
                            window.usuarioLogado = res.usuario || u; 
                            localStorage.setItem('admin_logado', 'true'); 
                            localStorage.setItem('admin_user', window.usuarioLogado); 
                            var lbl = document.getElementById('label-usuario-logado'); if(lbl) lbl.innerText = window.usuarioLogado.toUpperCase();
                            document.getElementById('modalLogin').classList.add('hidden'); 
                            document.getElementById('view-admin').classList.remove('hidden');
                            carregarNoticiasAdmin();
                        } else { 
                            mostrarMensagem(res ? res.erro : "Resposta inválida.", 'erro'); 
                            btn.innerHTML = "Entrar no Painel"; btn.disabled = false; 
                        }
                    }).catch(function(erro) {
                        mostrarMensagem("Falha na rede.", 'erro'); 
                        btn.innerHTML = "Entrar no Painel"; btn.disabled = false;
                    });
                }
            }, 100);
        }

        function encerrarSessao() {
            localStorage.removeItem('admin_logado'); localStorage.removeItem('admin_user'); 
            window.location.href = "index.html";
        }

        function alternarAbaAdmin(abaId) {
            ['form-noticia-container', 'lista-noticias-container'].forEach(function(id) { var el = document.getElementById(id); if (el) el.classList.add('hidden'); });
            
            var classInativa = "py-4 px-8 font-black text-[11px] bg-gray-100 text-gray-500 hover:text-gray-800 hover:bg-gray-200 uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors shadow-sm";
            var classAtiva = "py-4 px-8 font-black text-[11px] bg-[#020617] text-white uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors shadow-sm";
            
            ['aba-noticia', 'aba-lista'].forEach(function(id) { var el = document.getElementById(id); if (el) el.className = classInativa; });
            var targetEl = document.getElementById(abaId); if(targetEl) targetEl.classList.remove('hidden');
            var botaoId = abaId === 'form-noticia-container' ? 'aba-noticia' : 'aba-lista'; 
            if (abaId === 'lista-noticias-container') carregarListaEdicao(); 
            var btnEl = document.getElementById(botaoId); if(btnEl) btnEl.className = classAtiva;
        }

        function carregarNoticiasAdmin() {
            var loader = document.getElementById('loading-global'); loader.classList.remove('hidden');
            var checkReady = setInterval(function() {
                if (window.firebaseBridge) {
                    clearInterval(checkReady);
                    window.firebaseBridge.getHomeData()
                        .then(function(res) {
                            loader.classList.add('hidden');
                            if (res && res.sucesso) {
                                noticiasGlobais = res.noticias || []; 
                                if (res.categorias && res.categorias.length > 0) listaCategoriasLocais = res.categorias;
                                renderizarChecklistCategoriasAdmin();
                                atualizarFiltroEditoriasAdmin();
                                if (!document.getElementById('lista-noticias-container').classList.contains('hidden')) carregarListaEdicao();
                            }
                        })
                        .catch(function(err) { loader.classList.add('hidden'); });
                }
            }, 100);
        }

        function renderizarChecklistCategoriasAdmin() {
            var checklistAdmin = document.getElementById('admin-categoria-checklist'); if(!checklistAdmin) return;
            checklistAdmin.innerHTML = '';
            listaCategoriasLocais.forEach(function(c) {
                if (!c) return; var nomeCat = String(c).trim();
                checklistAdmin.innerHTML += `<label class="flex items-center gap-3 cursor-pointer text-sm font-bold text-gray-700 p-2 hover:bg-gray-50 rounded-sm transition-colors"><input type="checkbox" name="admin-categorias-checkbox" value="${nomeCat}" onchange="atualizarCampoCidadeAdmin();" class="w-5 h-5 text-[#020617] rounded border-gray-300 focus:ring-[#020617]" /> ${nomeCat.toUpperCase()}</label>`;
            });
        }

        function normalizarTexto(str) { return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }

        function atualizarCampoCidadeAdmin() {
            var selecionadas = Array.from(document.querySelectorAll('input[name="admin-categorias-checkbox"]:checked'));
            var mostraCidade = selecionadas.some(function(cb) { return normalizarTexto(cb.value) === 'cidades'; });
            var container = document.getElementById('admin-cidade-container'); var input = document.getElementById('admin-cidade');
            if (container) container.classList.toggle('hidden', !mostraCidade);
            if (input) { input.required = mostraCidade; if (!mostraCidade) input.value = ''; }
        }

        function novaCategoria() {
            var nome = prompt("Escreva o nome da nova editoria:"); if (!nome) return;
            window.firebaseBridge.adicionarCategoriaNoSheets({nome: nome}).then(function(res){
                if(res.sucesso) { mostrarMensagem("Editoria adicionada!"); if(listaCategoriasLocais.indexOf(nome) === -1) listaCategoriasLocais.push(nome); renderizarChecklistCategoriasAdmin(); atualizarFiltroEditoriasAdmin(); }
            });
        }

        function buscarRelacionadas() {
            var inputVal = normalizarTexto(document.getElementById('admin-busca-relacionada').value);
            var divResultados = document.getElementById('lista-resultados-relacionadas');
            if(!inputVal || inputVal.length < 2) { divResultados.innerHTML = '<div class="text-xs text-indigo-500 font-bold p-2">Digite pelo menos 2 letras.</div>'; return; }
            var res = noticiasGlobais.filter(function(n) { var txt = normalizarTexto([n.titulo, n.categoria, n.cidade].join(' ')); return n.status === 'Ativa' && txt.indexOf(inputVal) !== -1; }).slice(0, 5);
            var html = '';
            if (res.length === 0) { html = '<div class="text-xs text-indigo-500 font-bold p-2">Nenhum resultado encontrado.</div>'; }
            else {
                res.forEach(function(n) {
                    var tituloSafe = n.titulo.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += '<div class="flex justify-between items-center p-3 bg-white border border-indigo-200 text-xs rounded-sm hover:shadow-md transition-shadow"><div class="flex-grow min-w-0 pr-2 truncate font-bold text-gray-700">' + n.titulo + '</div><button type="button" onclick="adicionarRelacionada(\'' + n.id + '\', \'' + tituloSafe + '\')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-black px-3 py-1 rounded text-[10px] uppercase tracking-widest shrink-0">Add</button></div>';
                });
            }
            divResultados.innerHTML = html;
        }

        function adicionarRelacionada(id, titulo) {
            if (window.relacionadasSelecionadas.length >= 3) { mostrarMensagem("Limite de 3 matérias.", "erro"); return; }
            if (window.relacionadasSelecionadas.find(function(r) { return r.id === id; })) { mostrarMensagem("Já selecionada.", "erro"); return; }
            window.relacionadasSelecionadas.push({id: id, titulo: titulo});
            atualizarUIListaRelacionadas();
            document.getElementById('lista-resultados-relacionadas').innerHTML = '';
            document.getElementById('admin-busca-relacionada').value = '';
        }

        function removerRelacionada(id) {
            window.relacionadasSelecionadas = window.relacionadasSelecionadas.filter(function(r) { return r.id !== id; });
            atualizarUIListaRelacionadas();
        }

        function atualizarUIListaRelacionadas() {
            var html = '';
            window.relacionadasSelecionadas.forEach(function(r) {
                html += '<div class="flex justify-between items-center p-3 bg-[#4f46e5] text-white text-xs rounded-sm shadow-sm"><div class="flex-grow min-w-0 pr-2 truncate font-bold">' + r.titulo + '</div><button type="button" onclick="removerRelacionada(\'' + r.id + '\')" class="text-red-200 hover:text-white font-black px-2 py-1 text-[10px] uppercase tracking-widest">Remover</button></div>';
            });
            document.getElementById('lista-selecionadas-relacionadas').innerHTML = html;
            document.getElementById('admin-relacionadas-ids').value = window.relacionadasSelecionadas.map(function(r){return r.id;}).join(',');
        }

        function execCmd(command, arg) { if(arg === undefined) arg = null; document.execCommand(command, false, arg); document.getElementById('admin-editor-rich').focus(); }
        function inserirLinkRichEditor() { var url = prompt("Insira a URL completa:"); if (url) execCmd('createLink', url); }
        function inserirImagemRichEditor() { document.getElementById('upload-imagem-conteudo').click(); }

        function processarUploadImagemConteudo(input) {
            if (!input.files || !input.files[0]) return; var file = input.files[0]; var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas'); var ctx = canvas.getContext('2d'); var maxWidth = 500; var scale = 1;
                    if (img.width > maxWidth) scale = maxWidth / img.width;
                    canvas.width = img.width * scale; canvas.height = img.height * scale; ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    var base64Resized = canvas.toDataURL('image/jpeg', 0.6); 
                    var htmlImg = `<br><figure style="margin: 16px auto; text-align: center; max-width: 100%; display: block;"><img src="${base64Resized}" style="max-width: 100%; height: auto; border-radius: 8px; display: inline-block; margin: 0 auto; border: 1px solid #e2e8f0;" /></figure><br><p>&#8203;</p>`; 
                    execCmd('insertHTML', htmlImg); input.value = '';
                }; img.src = e.target.result;
            }; reader.readAsDataURL(file);
        }

        function verificarUploadMedia(input) {
            var containerMetadados = document.getElementById('admin-imagem-metadados'); var inputCreditos = document.getElementById('admin-creditos-imagem');
            if (input && input.files && input.files[0]) { if (containerMetadados) containerMetadados.classList.remove('hidden'); if (inputCreditos) inputCreditos.required = true; } 
            else { var prevSrc = document.getElementById('preview-imagem').src; if (!prevSrc || prevSrc === "") { if (containerMetadados) containerMetadados.classList.add('hidden'); if (inputCreditos) inputCreditos.required = false; } }
        }

        var adminArquivoInput = document.getElementById('admin-arquivo-imagem');
        if(adminArquivoInput) {
            adminArquivoInput.addEventListener('change', function(e) {
                var file = e.target.files[0]; if (!file) { base64StringNoticia = ""; return; }
                mimeStringNoticia = file.type; nameStringNoticia = file.name;
                var reader = new FileReader(); 
                reader.onload = function(evt) { base64StringNoticia = evt.target.result.split(',')[1]; document.getElementById('preview-imagem').src = evt.target.result; document.getElementById('preview-imagem').classList.remove('hidden'); verificarUploadMedia(e.target); }; 
                reader.readAsDataURL(file);
            });
        }

        function limparFormNoticia() {
            document.getElementById('form-admin').reset(); document.getElementById('admin-id-noticia').value = ""; document.getElementById('preview-imagem').classList.add('hidden'); document.getElementById('preview-imagem').src = ""; document.getElementById('admin-editor-rich').innerHTML = ""; document.getElementById('admin-imagem-metadados').classList.add('hidden'); document.getElementById('admin-creditos-imagem').required = false; base64StringNoticia = ""; document.querySelectorAll('input[name="admin-categorias-checkbox"]').forEach(function(cb) { cb.checked = false; }); atualizarCampoCidadeAdmin(); 
            window.relacionadasSelecionadas = []; atualizarUIListaRelacionadas();
            var btnSalvar = document.getElementById('btn-salvar-noticia'); if (btnSalvar) btnSalvar.innerText = "PUBLICAR MATÉRIA"; document.getElementById('titulo-pagina-form').innerText = "REDIGIR MATÉRIA";
        }

        function salvarRascunho() { processarGravacaoNoticia('Inativa'); }
        function salvarNoticia(e) { if(e) e.preventDefault(); processarGravacaoNoticia('Ativa'); }

        function processarGravacaoNoticia(statusSelecionado) {
            var editandoID = document.getElementById('admin-id-noticia').value; var prevSrc = document.getElementById('preview-imagem').src; var temImagemAnterior = prevSrc && prevSrc !== "";
            var checkboxes = document.querySelectorAll('input[name="admin-categorias-checkbox"]:checked'); 
            var tituloDigitado = document.getElementById('admin-titulo').value.trim(); var creditos = document.getElementById('admin-creditos-imagem').value.trim();
            
            if (!tituloDigitado || checkboxes.length === 0) { mostrarMensagem("Manchete e Editoria obrigatórias.", "erro"); return; }
            if ((base64StringNoticia || temImagemAnterior) && !creditos) { mostrarMensagem("Crédito de imagem obrigatório.", "erro"); return; }
            
            var categoriasSelecionadas = Array.from(checkboxes).map(function(cb) { return cb.value; }).join(", ");
            var btn = document.getElementById('btn-salvar-noticia'); var txtOriginal = btn.innerHTML; btn.innerHTML = 'A GUARDAR...'; btn.disabled = true;

            var conteudoRich = document.getElementById('admin-editor-rich').innerHTML;
            var payload = { 
                id: editandoID, titulo: tituloDigitado, categoria: categoriasSelecionadas, cidade: document.getElementById('admin-cidade') ? document.getElementById('admin-cidade').value : '', 
                linhaFina: document.getElementById('admin-linha-fina').value.trim(), conteudo: conteudoRich, 
                autor: document.getElementById('admin-autor').value.trim(), dataAgendamento: document.getElementById('admin-agendamento').value, 
                dataFimEvento: document.getElementById('admin-data-fim-evento').value, legendaImagem: document.getElementById('admin-legenda-imagem').value, 
                creditosImagem: creditos, statusForcado: statusSelecionado, noCarrossel: document.getElementById('admin-carrossel').checked,
                usuarioPublicador: window.usuarioLogado, relacionadas: document.getElementById('admin-relacionadas-ids').value
            };
            
            if (base64StringNoticia) { payload.isUpload = true; payload.base64 = base64StringNoticia; payload.mimeType = mimeStringNoticia; payload.fileName = nameStringNoticia; } 
            else if (temImagemAnterior) { payload.urlImagem = prevSrc; payload.isUpload = false; }
            else { payload.isUpload = false; }
            
            window.firebaseBridge.salvarNoticiaNoSheets(payload).then(function(res){
                btn.innerHTML = txtOriginal; btn.disabled = false;
                if(res.sucesso) { mostrarMensagem('Matéria Guardada com Sucesso!'); limparFormNoticia(); carregarNoticiasAdmin(); setTimeout(function(){ alternarAbaAdmin('lista-noticias-container'); }, 1000); }
                else { mostrarMensagem("Erro: " + res.erro, "erro"); }
            }).catch(function(e) { btn.innerHTML = txtOriginal; btn.disabled = false; });
        }

        function atualizarFiltroEditoriasAdmin() {
            var select = document.getElementById('admin-filtro-editoria'); if (!select) return;
            var valorAtual = select.value || 'todas'; var categorias = [];
            noticiasGlobais.forEach(function(n) { String((n && n.categoria) || '').split(',').forEach(function(categoria) { var nome = categoria.trim(); if (nome && categorias.map(normalizarTexto).indexOf(normalizarTexto(nome)) === -1) categorias.push(nome); }); });
            categorias.sort();
            select.innerHTML = '<option value="todas">Todas as editorias</option>' + categorias.map(function(c) { return '<option value="' + c.replace(/"/g, '&quot;') + '">' + c + '</option>'; }).join('');
            select.value = Array.from(select.options).some(function(o) { return o.value === valorAtual; }) ? valorAtual : 'todas';
        }

        function carregarListaEdicao() {
            var tbody = document.getElementById('admin-tabela-noticias'); if(!tbody) return; tbody.innerHTML = '';
            var sel = document.getElementById('admin-filtro-editoria'); var term = normalizarTexto(document.getElementById('admin-pesquisa-materia') ? document.getElementById('admin-pesquisa-materia').value : '');
            var catSel = sel ? sel.value : 'todas';
            
            var filtradas = noticiasGlobais.filter(function(n) {
                if (!n) return false;
                var matchCat = true;
                if (catSel !== 'todas') {
                    var catsNoticia = String(n.categoria || '').split(',').map(function(c){ return c.trim().toLowerCase(); });
                    matchCat = catsNoticia.indexOf(catSel.toLowerCase()) !== -1;
                }
                var txt = normalizarTexto([n.titulo, n.categoria].join(' '));
                var matchTerm = !term || txt.indexOf(term) !== -1;
                return matchCat && matchTerm;
            });
            
            if (filtradas.length === 0) { tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-xs text-gray-500 font-bold">Nenhuma matéria encontrada.</td></tr>`; return; }
            
            filtradas.forEach(function(n) {
                var statusVal = n.status ? String(n.status).trim() : 'Inativa';
                var isAtivo = statusVal === 'Ativa'; var isAgendado = statusVal === 'Agendada';
                var txtStat = isAtivo ? 'ATIVO' : (isAgendada ? 'AGENDADO' : 'INATIVO');
                var corStat = isAtivo ? 'text-emerald-700' : (isAgendada ? 'text-amber-600' : 'text-gray-400');
                var checkedAttr = isAtivo ? 'checked' : '';
                var categoryBadge = (n.categoria || 'Geral').split(',')[0].trim();

                var dataLimpa = n.dataHora || '';
                if (dataLimpa.includes('GMT') || dataLimpa.includes('Fri') || dataLimpa.includes('Sat') || dataLimpa.includes('Sun') || dataLimpa.includes('Mon') || dataLimpa.includes('Tue') || dataLimpa.includes('Wed') || dataLimpa.includes('Thu')) {
                    try {
                        var d = new Date(dataLimpa);
                        if (!isNaN(d.getTime())) {
                            var dia = String(d.getDate()).padStart(2, '0');
                            var mes = String(d.getMonth() + 1).padStart(2, '0');
                            var ano = d.getFullYear();
                            var hora = String(d.getHours()).padStart(2, '0');
                            var min = String(d.getMinutes()).padStart(2, '0');
                            dataLimpa = dia + '/' + mes + '/' + ano + ' ' + hora + ':' + min;
                        }
                    } catch(e){}
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100 transition-colors">
                        <td class="p-5 text-xs font-medium text-gray-500 whitespace-nowrap w-[110px]">${dataLimpa}</td>
                        <td class="p-5 whitespace-nowrap"><span class="bg-gray-200 text-gray-800 px-2.5 py-1.5 rounded-sm text-[9px] uppercase font-black tracking-widest">${categoryBadge}</span></td>
                        <td class="p-5 font-black text-[13px] text-[#0f172a] truncate max-w-[280px] whitespace-normal leading-tight" title="${n.titulo.replace(/"/g, '&quot;')}">${n.titulo}</td>
                        <td class="p-5 text-xs font-medium text-gray-500 whitespace-nowrap">${n.autor || 'da redação'}</td>
                        <td class="p-5 text-xs font-medium text-gray-500 whitespace-nowrap">${n.usuarioPublicador || 'admin'}</td>
                        <td class="p-5 text-xs font-black text-gray-400 whitespace-nowrap text-center"><span class="text-[14px]">👁</span> <span class="text-[#0f172a]">${n.views || 0}</span></td>
                        <td class="p-5 whitespace-nowrap text-center w-[140px]">
                            <label class="inline-flex items-center cursor-pointer select-none">
                                <input type="checkbox" class="sr-only peer" ${checkedAttr} onchange="alterarStatusRapido('${n.id}', this)" />
                                <div class="w-10 h-5 bg-gray-300 rounded-full peer peer-checked:bg-emerald-500 transition-colors relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full peer-checked:after:border-white"></div>
                                <span class="ml-2 text-[10px] font-black uppercase tracking-widest min-w-[65px] inline-block text-left ${corStat}">${txtStat}</span>
                            </label>
                        </td>
                        <td class="p-5 text-center whitespace-nowrap w-[160px]">
                            <div class="inline-flex gap-2 justify-center items-center">
                                <button type="button" onclick="editarNoticia('${n.id}')" class="text-[10px] font-black uppercase text-[#0f172a] border border-gray-300 px-3 py-1.5 rounded-sm hover:bg-gray-100 transition-colors bg-white">EDITAR</button>
                                <button type="button" onclick="apagarMateria('${n.id}')" class="text-[10px] font-black uppercase text-red-600 border border-red-200 px-3 py-1.5 rounded-sm hover:bg-red-50 transition-colors bg-white">EXCLUIR</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function alterarStatusRapido(id, checkbox) { 
            var isAtivo = checkbox.checked;
            var labelSpan = checkbox.nextElementSibling;
            if (labelSpan) {
                labelSpan.innerText = isAtivo ? 'ATIVO' : 'INATIVO';
                labelSpan.className = 'ml-2 text-[10px] font-black uppercase tracking-widest min-w-[65px] inline-block text-left ' + (isAtivo ? 'text-emerald-700' : 'text-gray-400');
            }
            window.firebaseBridge.alternarStatusNoticia(id).then(function(res){ 
                if(res.sucesso) carregarNoticiasAdmin(); 
                else { checkbox.checked = !checkbox.checked; mostrarMensagem("Erro a alterar status.", "erro"); }
            }).catch(function(e) { checkbox.checked = !checkbox.checked; }); 
        }

        function apagarMateria(id) { 
            if(confirm("Eliminar permanentemente?")) {
                window.firebaseBridge.excluirNoticia(id).then(function(res){ 
                    if(res.sucesso) carregarNoticiasAdmin(); 
                    else mostrarMensagem("Erro ao apagar.", "erro");
                }).catch(function(e) { mostrarMensagem("Falha de rede.", "erro"); });
            }
        }

        function editarNoticia(id) {
            var noticia = noticiasGlobais.find(function(n) { return String(n.id) === String(id); }); if(!noticia) return;
            limparFormNoticia(); 
            document.getElementById('admin-id-noticia').value = noticia.id; document.getElementById('admin-titulo').value = noticia.titulo || ''; 
            document.getElementById('admin-linha-fina').value = noticia.linhaFina || ""; document.getElementById('admin-editor-rich').innerHTML = noticia.conteudo || ''; 
            document.getElementById('admin-autor').value = noticia.autor !== "da redação" ? (noticia.autor || '') : ""; 
            var cats = String(noticia.categoria).split(',').map(function(c) { return c.trim().toLowerCase(); }); 
            document.querySelectorAll('input[name="admin-categorias-checkbox"]').forEach(function(cb) { cb.checked = cats.indexOf(cb.value.toLowerCase()) !== -1; }); 
            document.getElementById('admin-legenda-imagem').value = noticia.legendaImagem || ''; document.getElementById('admin-creditos-imagem').value = noticia.creditosImagem || '';
            document.getElementById('admin-carrossel').checked = (String(noticia.noCarrossel) === 'true');
            
            if (noticia.dataHora && String(noticia.status) === 'Agendada') {
                var pts = noticia.dataHora.split(/[\/\s:]/);
                if (pts.length >= 5) document.getElementById('admin-agendamento').value = pts[2]+'-'+pts[1]+'-'+pts[0]+'T'+pts[3]+':'+pts[4];
            }
            if (noticia.dataFimEvento) {
                try { var dtFim = new Date(noticia.dataFimEvento); if(!isNaN(dtFim.getTime())) document.getElementById('admin-data-fim-evento').value = dtFim.toISOString().slice(0,16); } catch(e){}
            }
            
            if (noticia.relacionadas) {
                var relIds = String(noticia.relacionadas).split(',');
                window.relacionadasSelecionadas = [];
                relIds.forEach(function(rId) {
                    var rn = noticiasGlobais.find(function(x) { return x.id === rId.trim(); });
                    if(rn) window.relacionadasSelecionadas.push({id: rn.id, titulo: rn.titulo});
                });
                atualizarUIListaRelacionadas();
            } else {
                window.relacionadasSelecionadas = [];
                atualizarUIListaRelacionadas();
            }
            
            var prevImg = document.getElementById('preview-imagem'); 
            if (prevImg) { if(noticia.urlImagem) { prevImg.src = noticia.urlImagem; prevImg.classList.remove('hidden'); document.getElementById('admin-imagem-metadados').classList.remove('hidden'); } else { prevImg.classList.add('hidden'); } }
            document.getElementById('titulo-pagina-form').innerText = "EDITAR MATÉRIA"; alternarAbaAdmin('form-noticia-container'); window.scrollTo(0,0);
        }
    </script>
</body>
</html>
