<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerir Matérias - Notícias Avulsas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyoHo_olvZbyvT-qfKBDAveq1-n1IHD_bLxf831i_bBrFJeSVTcc6RTfvdQ9QV25hTh/exec";
        
        window.google = {
            script: {
                run: {
                    withSuccessHandler: function(cb) { this._onSuccess = cb; return this; },
                    withFailureHandler: function(cb) { this._onFailure = cb; return this; }
                }
            }
        };

        const apiFunctions = ['getHomeData', 'verificarLogin', 'alternarStatusNoticia', 'excluirNoticia'];

        apiFunctions.forEach(function(funcName) {
            window.google.script.run[funcName] = function() {
                var argsArray = Array.prototype.slice.call(arguments);
                var successCb = this._onSuccess;
                var failureCb = this._onFailure;
                this._onSuccess = null; this._onFailure = null;
                
                fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: funcName, args: argsArray })
                })
                .then(function(res) { return res.json(); })
                .then(function(result) {
                    if (successCb) {
                        var finalPayload = result;
                        if (result && result.result !== undefined) {
                            finalPayload = typeof result.result === 'string' ? JSON.parse(result.result) : result.result;
                        }
                        successCb(finalPayload);
                    }
                })
                .catch(function(err) {
                    if (failureCb) failureCb(err);
                });
            };
        });

        var configureTailwind = function() {
            if (typeof tailwind === 'undefined') { setTimeout(configureTailwind, 10); return; }
            tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { jornal: { blue: '#0F172A', red: '#E11D48', gray: '#F8FAFC', dark: '#020617' } } } } };
        };
        configureTailwind();
    </script>
    
    <style>
        body { background-color: #f1f2f5; color: #111111; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative selection:bg-jornal-red selection:text-white">

    <div id="toast" class="hidden fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border rounded-sm">
        <span id="toast-icon" class="text-xl"></span>
        <span id="toast-msg" class="text-sm"></span>
    </div>

    <div id="loading-global" class="fixed inset-0 z-[99998] bg-jornal-dark flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-gray-700 border-t-jornal-red rounded-full animate-spin mb-4"></div>
        <p class="text-xs font-black uppercase tracking-widest text-gray-300 animate-pulse">Acessar Sistema...</p>
    </div>

    <!-- Modal de Login -->
    <div id="modalLogin" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-jornal-dark/95 backdrop-blur-md"></div>
        <div class="bg-white w-full max-w-sm p-8 rounded-sm shadow-2xl relative z-10 border-t-4 border-jornal-red">
            <div class="mb-6 text-center">
                <h2 class="font-sans text-xl font-black uppercase text-jornal-dark tracking-tighter">Gerir Matérias</h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Acesso restrito a administradores</p>
            </div>
            <form onsubmit="fazerLogin(event)" class="space-y-4">
                <input type="text" id="login-user" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 focus:outline-none focus:border-jornal-blue text-sm font-bold rounded-sm" required placeholder="Usuário (Ex: admin)" />
                <input type="password" id="login-pass" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 focus:outline-none focus:border-jornal-blue text-sm font-bold rounded-sm" required placeholder="Senha" />
                <button type="submit" id="btn-fazer-login" class="w-full bg-jornal-blue text-white font-black py-3 hover:opacity-90 transition-colors text-xs uppercase tracking-widest rounded-sm mt-4">Entrar no Painel</button>
            </form>
        </div>
    </div>

    <div id="view-admin" class="hidden min-h-screen flex flex-col bg-gray-100 text-slate-800">
        
        <header class="bg-jornal-dark text-white border-b border-gray-800 sticky top-0 z-40 shadow-sm">
            <div class="max-w-[1200px] mx-auto flex justify-between items-center px-4 py-3">
                <div class="flex items-center gap-3">
                    <span class="font-sans font-black tracking-tighter text-lg uppercase text-slate-100 flex items-center gap-2">Gerir<span class="text-rose-600">Matérias</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <button type="button" onclick="encerrarSessao()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-sm text-[10px] font-black uppercase tracking-widest transition-colors shadow-sm">Sair (Logout)</button>
                </div>
            </div>
        </header>

        <main class="max-w-[1200px] mx-auto py-6 md:py-8 px-4 w-full flex-grow">
            <!-- NAVEGAÇÃO REFEITA COM LINKS REAIS -->
            <div class="flex gap-1 mb-6 border-b-2 border-gray-300 overflow-x-auto custom-scrollbar">
                <a href="admin.html" class="py-3 px-5 font-bold text-[11px] bg-gray-200 text-gray-500 hover:text-gray-800 hover:bg-gray-300 uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors">Publicar</a>
                <a href="gerir.html" class="py-3 px-5 font-black text-[11px] bg-jornal-dark text-white uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors">Gerir Matérias</a>
                <a href="config.html" class="py-3 px-5 font-bold text-[11px] bg-gray-200 text-gray-500 hover:text-gray-800 hover:bg-gray-300 uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors flex items-center gap-1">⚙️ Configurações</a>
                <a href="instagram.html" target="_blank" class="py-3 px-5 font-bold text-[11px] bg-gray-200 text-purple-600 hover:text-purple-800 hover:bg-purple-100 uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors flex items-center gap-1">📸 Estúdio IG</a>
                <a href="index.html" class="py-3 px-5 font-bold text-[11px] bg-emerald-100 text-emerald-700 hover:bg-emerald-200 uppercase tracking-widest whitespace-nowrap rounded-t-sm transition-colors flex items-center gap-1 ml-auto">Ver Portal &raquo;</a>
            </div>

            <!-- LISTAGEM ADMIN (EDITAR PUBLICAÇÕES) -->
            <div id="lista-noticias-container" class="bg-white p-6 shadow-sm border border-gray-200 rounded-sm">
                <div class="border-l-4 border-jornal-red pl-3 mb-6">
                    <h2 class="font-sans text-xl font-black text-jornal-dark uppercase tracking-tighter">Editar Publicações</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-gray-50 border border-gray-200 rounded-sm">
                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-1 block">Filtrar por editoria</label>
                        <select id="admin-filtro-editoria" onchange="carregarListaEdicao()" class="w-full px-4 py-3 bg-white border border-gray-300 focus:outline-none focus:border-jornal-blue text-sm font-bold text-jornal-dark rounded-sm">
                            <option value="todas">Todas as editorias</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-1 block">Pesquisar matéria</label>
                        <input type="search" id="admin-pesquisa-materia" oninput="carregarListaEdicao()" placeholder="Digite título ou conteúdo..." class="w-full px-4 py-3 bg-white border border-gray-300 focus:outline-none focus:border-jornal-blue text-sm text-jornal-dark rounded-sm" />
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-100 border-b border-gray-300 text-[10px] uppercase tracking-widest text-gray-500">
                            <tr>
                                <th class="p-4">Data</th>
                                <th class="p-4">Editorias</th>
                                <th class="p-4">Manchete</th>
                                <th class="p-4 text-center">Visões</th>
                                <th class="p-4 text-center">Visibilidade</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="admin-tabela-noticias" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPTS CORE E LÓGICA -->
    <script>
        var noticiasGlobais = [];

        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem('admin_logado') === 'true') {
                document.getElementById('modalLogin').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                carregarNoticiasAdmin(false);
            } else {
                document.getElementById('loading-global').classList.add('hidden');
                document.getElementById('modalLogin').classList.remove('hidden');
                document.getElementById('modalLogin').classList.add('flex');
            }
        });

        function mostrarMensagem(mensagem, tipo) {
            if(tipo === undefined) tipo = 'sucesso';
            var toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = mensagem;
            toast.className = tipo === 'erro' ? 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-white border-red-600 text-red-600 rounded-sm' : 'fixed top-5 right-5 px-6 py-4 font-bold shadow-2xl transition-all duration-300 z-[99999] flex items-center gap-3 border bg-jornal-dark border-jornal-dark text-white rounded-sm';
            document.getElementById('toast-icon').innerHTML = tipo === 'erro' ? '⚠️' : '✓';
            toast.classList.remove('hidden');
            setTimeout(function() { toast.classList.add('hidden'); }, 4500);
        }

        function fazerLogin(e) {
            e.preventDefault();
            var u = document.getElementById('login-user').value; var p = document.getElementById('login-pass').value;
            var btn = document.getElementById('btn-fazer-login'); btn.innerHTML = "A VERIFICAR..."; btn.disabled = true;

            if (typeof window.google !== 'undefined' && window.google.script && window.google.script.run) {
                window.google.script.run.withSuccessHandler(function(res) {
                    if (res && res.sucesso) {
                        try { localStorage.setItem('admin_logado', 'true'); } catch(err) {}
                        document.getElementById('modalLogin').classList.add('hidden');
                        document.getElementById('view-admin').classList.remove('hidden');
                        carregarNoticiasAdmin(false);
                    } else { mostrarMensagem(res ? res.erro : "Resposta inválida.", 'erro'); }
                    btn.innerHTML = "Entrar no Painel"; btn.disabled = false;
                }).withFailureHandler(function(erro) {
                    mostrarMensagem("Falha na rede: " + erro.message, 'erro');
                    btn.innerHTML = "Entrar no Painel"; btn.disabled = false;
                }).verificarLogin(u, p);
            }
        }

        function encerrarSessao() { try { localStorage.removeItem('admin_logado'); } catch(err) {} window.location.href = "index.html"; }

        function carregarNoticiasAdmin(silencioso) {
            if (!silencioso) { document.getElementById('loading-global').classList.remove('hidden'); }
            if (typeof window.google !== 'undefined' && window.google.script && window.google.script.run) {
                window.google.script.run.withSuccessHandler(function(res) {
                    if (!silencioso) { document.getElementById('loading-global').classList.add('hidden'); }
                    if (res && res.sucesso) {
                        noticiasGlobais = res.noticias || []; 
                        carregarListaEdicao();
                    }
                }).withFailureHandler(function(err) {
                    if (!silencioso) { document.getElementById('loading-global').classList.add('hidden'); }
                    mostrarMensagem("Falha de Servidor.", 'erro');
                }).getHomeData();
            }
        }

        function normalizarTexto(str) { return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }

        function atualizarFiltroEditoriasAdmin() {
            var select = document.getElementById('admin-filtro-editoria');
            if (!select) return;
            var valorAtual = select.value || 'todas';
            var categorias = [];
            noticiasGlobais.forEach(function(n) {
                String((n && n.categoria) || '').split(',').forEach(function(categoria) {
                    var nome = categoria.trim();
                    if (nome && categorias.map(normalizarTexto).indexOf(normalizarTexto(nome)) === -1) categorias.push(nome);
                });
            });
            categorias.sort();
            select.innerHTML = '<option value="todas">Todas as editorias</option>' + categorias.map(function(c) { return '<option value="' + c.replace(/"/g, '&quot;') + '">' + c + '</option>'; }).join('');
            select.value = Array.from(select.options).some(function(o) { return o.value === valorAtual; }) ? valorAtual : 'todas';
        }

        function carregarListaEdicao() {
            var tbody = document.getElementById('admin-tabela-noticias');
            if(!tbody) return;
            atualizarFiltroEditoriasAdmin();
            tbody.innerHTML = '';
            
            var sel = document.getElementById('admin-filtro-editoria'); var inp = document.getElementById('admin-pesquisa-materia');
            var catSel = normalizarTexto(sel ? sel.value : 'todas'); var term = normalizarTexto(inp ? inp.value : '');
            
            var filtradas = noticiasGlobais.filter(function(n) {
                if (!n) return false;
                var cats = String(n.categoria || '').split(',').map(normalizarTexto);
                var matchCat = catSel === 'todas' || cats.indexOf(catSel) !== -1;
                var text = normalizarTexto([n.titulo, n.linhaFina, n.cidade].join(' '));
                var matchTerm = !term || text.indexOf(term) !== -1;
                return matchCat && matchTerm;
            });
            
            if (filtradas.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-xs text-gray-500 font-bold">Nenhuma matéria encontrada.</td></tr>'; return; }
            
            filtradas.forEach(function(n) {
                var isAtivo = n.status.toLowerCase() === 'ativa'; var isAgendada = n.status.toLowerCase() === 'agendada';
                var isRascunho = n.status.toLowerCase() === 'rascunho';
                
                var txtStat = isRascunho ? 'RASCUNHO' : (isAtivo ? 'ATIVO' : (isAgendada ? 'AGENDADO' : 'INATIVO'));
                var corStat = isRascunho ? 'text-blue-500' : (isAtivo ? 'text-gray-700' : (isAgendada ? 'text-amber-600' : 'text-gray-400'));
                
                tbody.innerHTML += '<tr class="hover:bg-gray-50 border-b border-gray-100">' +
                    '<td class="p-4 text-xs font-medium text-gray-500">' + (n.dataHora || '') + '</td>' +
                    '<td class="p-4"><span class="bg-gray-200 text-gray-800 px-2 py-1 rounded-sm text-[9px] uppercase font-black tracking-widest">' + (n.categoria || 'Geral') + '</span></td>' +
                    '<td class="p-4 font-bold text-sm text-jornal-dark truncate max-w-[250px]" title="'+n.titulo+'">' + (n.titulo || '') + '</td>' +
                    '<td class="p-4 text-center text-xs font-black text-jornal-blue">👁️ ' + (n.views || 0) + '</td>' +
                    '<td class="p-4 text-center"><div class="flex justify-center items-center"><label class="relative inline-flex items-center cursor-pointer select-none">' +
                    '<input type="checkbox" class="sr-only peer" ' + (isAtivo ? 'checked' : '') + ' onchange="alterarStatusRapido(\'' + n.id + '\', this)" />' +
                    '<div class="w-10 h-5 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[\'\'] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>' +
                    '<span class="ml-2 text-[10px] font-black ' + corStat + ' select-none uppercase tracking-widest inline-block w-16 text-left">' + txtStat + '</span></label></div></td>' +
                    '<td class="p-4 text-center flex gap-2 justify-center">' +
                    '<button type="button" onclick="mandarParaEdicao(\'' + n.id + '\')" class="text-[10px] font-black uppercase tracking-widest text-jornal-blue border border-jornal-blue/30 px-3 py-1.5 rounded-sm hover:bg-jornal-blue hover:text-white transition-colors">Editar</button>' +
                    '<button type="button" onclick="apagarMateria(\'' + n.id + '\')" class="text-[10px] font-black uppercase tracking-widest text-red-600 border border-red-200 px-3 py-1.5 rounded-sm hover:bg-red-50 transition-colors">Excluir</button>' +
                    '</td></tr>';
            });
        }

        // A MÁGICA: Este botão atira-o para o admin.html com a instrução para abrir a matéria!
        function mandarParaEdicao(id) {
            window.location.href = "admin.html?edit_id=" + id;
        }

        function alterarStatusRapido(id, checkbox) {
            var isAtivo = checkbox.checked; var labelSpan = checkbox.nextElementSibling.nextElementSibling;
            if (labelSpan) { labelSpan.innerText = isAtivo ? 'ATIVO' : 'INATIVO'; labelSpan.className = 'ml-2 text-[10px] font-black ' + (isAtivo ? 'text-gray-700' : 'text-gray-400') + ' select-none uppercase tracking-widest inline-block w-16 text-left'; }
            if (typeof window.google !== 'undefined' && window.google.script && window.google.script.run) { 
                localStorage.removeItem('admin_data_cache'); 
                window.google.script.run
                .withSuccessHandler(function(res){ 
                    if(res && res.sucesso) { carregarNoticiasAdmin(true); } 
                })
                .withFailureHandler(function(err){
                    mostrarMensagem("Erro de conexão.", "erro");
                })
                .alternarStatusNoticia(id); 
            }
        }

        function apagarMateria(id) {
            if(!confirm("Atenção! Vai eliminar permanentemente a matéria. Tem a certeza?")) {
                return;
            }
            if (typeof window.google !== 'undefined' && window.google.script && window.google.script.run) { 
                localStorage.removeItem('admin_data_cache'); 
                window.google.script.run
                .withSuccessHandler(function(res){ 
                    carregarNoticiasAdmin(true); 
                })
                .withFailureHandler(function(err){
                    mostrarMensagem("Falha na rede.", "erro");
                })
                .excluirNoticia(id); 
            }
        }
    </script>
</body>
</html>
